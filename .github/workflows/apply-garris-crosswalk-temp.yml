name: Apply Garris signer crosswalk (temporary)

on:
  push:
    paths:
      - '.github/apply-garris-crosswalk.trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply reviewed Letter 2 canonical seeds
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          people_path = 'data/people.json'
          garris_path = 'sources/normalized/public-statements/garris-letters-2024.json'
          receipt_path = 'sources/raw/identity/2024-garris-letter2-identity-evidence-2026-09-14.json'

          people = load(people_path)
          garris = load(garris_path)
          receipt = load(receipt_path)

          seeds = {
              2: ('moses-lee', 'Moses Lee'),
              4: ('david-lee-redeemer-downtown', 'David Lee'),
              6: ('aaron-chung', 'Aaron Chung'),
              7: ('gene-joo', 'Gene Joo'),
              18: ('jeff-white-redeemer-downtown', 'Jeff White'),
              19: ('gregory-perry', 'Gregory Perry'),
              20: ('jeffrey-jou', 'Jeffrey Jou'),
          }

          people_by_id = {row['id']: row for row in people}
          for order, (person_id, name) in seeds.items():
              existing = people_by_id.get(person_id)
              if existing:
                  if existing.get('name') != name:
                      raise SystemExit(f'canonical id collision: {person_id} -> {existing.get("name")}')
                  if existing.get('profile_status') == 'identity_crosswalk':
                      existing['profile_status'] = 'source_assessed'
              else:
                  row = {
                      'id': person_id,
                      'name': name,
                      'ordination': 'Teaching Elder',
                      'current_role': None,
                      'current_organization': None,
                      'denominational_status': 'PCA Teaching Elder in the 2024 Garris Letter 2 source; current status not assessed in this identity slice',
                      'current_role_source_ids': [],
                      'profile_status': 'source_assessed',
                  }
                  people.append(row)
                  people_by_id[person_id] = row

          letter2 = next(row for row in garris['letters'] if row['letter_id'] == 'garris-letter-2')
          signer_by_order = {row['print_order']: row for row in letter2['signers']}
          for order, (person_id, name) in seeds.items():
              signer = signer_by_order[order]
              if signer['name_as_printed'] != name:
                  raise SystemExit(f'letter2 order {order} name drift: {signer["name_as_printed"]}')
              signer['normalized_person_id'] = person_id
              signer['identity_resolution'] = {
                  'status': 'reviewed_canonical_seed',
                  'receipt': receipt_path,
                  'rule': 'Person-specific reviewed identity decision; does not create a global same-name equivalence.'
              }

          receipt_by_order = {row['letter_print_order']: row for row in receipt['evidence']}
          for order, (person_id, name) in seeds.items():
              item = receipt_by_order[order]
              if item['name_as_printed'] != name:
                  raise SystemExit(f'receipt order {order} name drift')
              item['applied_canonical_id'] = person_id
              item['review_state'] = 'applied_canonical_seed'

          receipt['applied_identity_count'] = len(seeds)
          receipt['application_note'] = (
              'Seven rows that remained blocked by generic collision/context safeguards were applied as '
              'person-specific reviewed canonical seeds. The global resolver remains unchanged. The Letter 1 '
              'Jeff White row remains unresolved because its New City Fellowship / Rio Grande context does not '
              'match the reviewed Redeemer Downtown / Metro NY identity.'
          )

          save(people_path, people)
          save(garris_path, garris)
          save(receipt_path, receipt)
          PY

      - name: Rebuild identities and project Garris signers
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Commit generated and permanent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/raw/identity/2024-garris-letter2-identity-evidence-2026-09-14.json sources/normalized/public-statements/garris-letters-2024.json sources/normalized/identity data/people.json data/affiliations.json data/events.json analysis/overlap
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'apply final reviewed Garris Letter 2 identities'
          git push
