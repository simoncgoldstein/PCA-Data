name: Patch Garris documentation (temporary)

on:
  push:
    paths:
      - '.github/apply-garris-crosswalk.trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Garris source and unresolved documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('research/source-register.md')
          source = source_path.read_text(encoding='utf-8')
          old = '''### Garris letters

Status: **registered primary sources; signer normalization remains the next major operational priority**.

Both publicly circulated letters are registered in `data/sources.json`. They should be normalized person-by-person from the source PDFs. Keep Letter 1 and Letter 2 as separate public actions. Do not convert co-signature into agreement with unrelated positions or broader network membership, and leave ambiguous same-name rows unresolved until corroborated.
'''
          new = '''### Garris letters

Status: **complete printed rosters normalized; Letter 2 fully canonical; Letter 1 partially canonical and queued for reviewed identity batches**.

Primary sources remain registered as `src-garris-letter-1` and `src-garris-letter-2`. The complete normalized rosters are in:

`sources/normalized/public-statements/garris-letters-2024.json`

Current source/identity state:

- Letter 1 preserves all **60** printed signers; **24** are currently canonical and app-projected.
- Letter 2 preserves all **21** printed signers; **21/21** are canonical and app-projected.
- confirmed signer edges are `public_coalition_action`, weight **3**, and score-included under the ordinary public-letter/protest methodology;
- `sources/raw/identity/2024-garris-letter2-identity-evidence-2026-09-14.json` preserves targeted independent identity corroboration for the Letter 2 completion pass;
- seven Letter 2 identities blocked by generic collision/context safeguards were applied as person-specific reviewed canonical seeds without weakening the global matching rule.

Critical collision boundary: Letter 1 `Jeff White` (New City Fellowship / Rio Grande) remains unresolved; Letter 2 `Jeff White` (Redeemer Downtown / Metro NY) is `jeff-white-redeemer-downtown`. Do not merge those rows by name alone.

A signature establishes participation in that specific letter and its request for presbytery investigation. It is a meaningful formal action for recurrence/coalition analysis, but co-signature does not by itself establish National Partnership or AMR membership, agreement on unrelated controversies, or a generic ideological label.

Reproducibility is handled by `scripts/build-person-crosswalk.py` followed by `scripts/project-garris-signers.py` and `scripts/build-overlap-analysis.py`; repository-wide CI requires those generated outputs to remain clean.
'''
          if old not in source:
              raise SystemExit('stale Garris source-register block not found')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          unresolved_path = Path('research/unresolved-identities.md')
          unresolved = unresolved_path.read_text(encoding='utf-8')
          marker = '## National Partnership archival pins\n'
          block = '''## Garris Letter 1 signer identities

The Garris source-ingestion layer is complete, but Letter 1 still has **36 unresolved signer rows** after conservative cross-source matching. Letter 2 is complete at 21/21 canonical identities.

Policy for the remaining Letter 1 queue:

- resolve in small reviewed batches using independent church, ministry, presbytery, or official denominational context;
- prioritize people who recur elsewhere in the graph or materially improve overlap analysis;
- do not relax the global same-name resolver merely to raise completion percentage;
- preserve printed office/church/presbytery context and the original source row;
- keep Letter 1 `Jeff White` (New City Fellowship / Rio Grande) unresolved unless independent evidence establishes that specific identity. It is not the reviewed Letter 2 `Jeff White` from Redeemer Downtown / Metro NY.

The generated identity review queue remains the working list. A resolved signature is weight 3 as a public-letter action, but identity resolution does not add unrelated network memberships or issue positions.

'''
          if block not in unresolved:
              if marker not in unresolved:
                  raise SystemExit('unresolved-identity insertion marker missing')
              unresolved_path.write_text(unresolved.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/source-register.md research/unresolved-identities.md
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
            exit 0
          fi
          git commit -m 'document Garris signer coverage and unresolved queue'
          git push
