name: Apply Garris signer crosswalk (temporary)

on:
  push:
    paths:
      - '.github/apply-garris-crosswalk.trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Register Garris letters in person crosswalk
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path('scripts/build-person-crosswalk.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\n# Human Sexuality AIC committee service.'
          if 'garris_letters_2024' in text:
              raise SystemExit('Garris crosswalk block already present')
          encoded = ''
          block = base64.b64decode(encoded).decode('utf-8')
          if marker not in text:
              raise SystemExit('crosswalk insertion marker not found')
          path.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Rebuild identities and project Garris signers
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Commit generated and permanent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-person-crosswalk.py sources/normalized/public-statements/garris-letters-2024.json sources/normalized/identity data/people.json data/affiliations.json data/events.json analysis/overlap
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'resolve and project Garris letter signers'
          git push
