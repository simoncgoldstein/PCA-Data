name: Clean reviewed identity queue flags

on:
  push:
    branches:
      - research/insider-movements-recovery-2026-09-04
    paths:
      - scripts/clean-reviewed-variant-queue.py
      - .github/workflows/clean-reviewed-variant-queue.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed-variant queue cleanup
        run: python3 scripts/clean-reviewed-variant-queue.py
      - name: Rebuild generated outputs
        run: |
          python3 scripts/build-person-crosswalk.py
          python3 scripts/build-overlap-analysis.py
      - name: Validate
        run: |
          python3 scripts/validate-formal-position-evidence.py
          node scripts/validate-data.mjs
          python3 scripts/validate-research-imports.py
      - name: Commit materialized result
        run: |
          rm scripts/clean-reviewed-variant-queue.py
          rm .github/workflows/clean-reviewed-variant-queue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude reviewed variants from generic review leads"
          git push
