name: Complete 2017 women-serving identities and Choi O37 (temporary)

on:
  push:
    paths:
      - '.github/complete-2017-women-serving-and-choi-o37.trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply final identities and Overture 37 app data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Complete the 2017 normalized committee identity layer.
          report_path = 'sources/normalized/general-assembly/2017-women-serving-ministry-report.json'
          report = load(report_path)
          final_ids = {'William Castro': 'william-castro', 'Lani Jones': 'lani-jones'}
          for row in report['committee_members']:
              if row['name'] in final_ids:
                  if row.get('normalized_person_id') is not None:
                      raise SystemExit(f"{row['name']} already resolved unexpectedly")
                  row['normalized_person_id'] = final_ids[row['name']]
          save(report_path, report)

          edges_path = 'sources/normalized/general-assembly/2017-women-serving-ministry-person-edges.json'
          edges_data = load(edges_path)
          edge_specs = {
              '2017-women-serving-committee-02': ('William Castro', 'william-castro'),
              '2017-women-serving-committee-07': ('Lani Jones', 'lani-jones'),
          }
          receipt = 'sources/raw/identity/2017-women-serving-identity-evidence-batch4-2026-09-14.json'
          for edge in edges_data['edges']:
              if edge['edge_id'] in edge_specs:
                  name, person_id = edge_specs[edge['edge_id']]
                  if edge['person_name'] != name or edge.get('normalized_person_id') is not None:
                      raise SystemExit(f"unexpected pre-state for {edge['edge_id']}")
                  edge['normalized_person_id'] = person_id
                  edge['identity_status'] = 'resolved_reviewed_canonical_person'
                  edge['identity_review_status'] = 'canonical_seed_applied'
                  edge['identity_review_receipt'] = receipt
                  edge['proposed_canonical_person_id'] = person_id
          save(edges_path, edges_data)

          # Add canonical people.
          people_path = 'data/people.json'
          people = load(people_path)
          new_people = [
              {
                  'id': 'william-castro',
                  'name': 'William Castro',
                  'ordination': 'Teaching Elder',
                  'current_role': None,
                  'current_organization': None,
                  'denominational_status': 'PCA Teaching Elder in 2017 official committee source; later/current role not modeled in this slice',
                  'current_role_source_ids': [],
                  'profile_status': 'seeded',
              },
              {
                  'id': 'lani-jones',
                  'name': 'Lani Jones',
                  'ordination': None,
                  'current_role': None,
                  'current_organization': None,
                  'denominational_status': 'PCA committee service documented in 2017 official source; current role not modeled in this slice',
                  'current_role_source_ids': [],
                  'profile_status': 'seeded',
              },
          ]
          existing_people = {row['id'] for row in people}
          collisions = existing_people & {row['id'] for row in new_people}
          if collisions:
              raise SystemExit(f'canonical person ids already exist: {sorted(collisions)}')
          people.extend(new_people)
          save(people_path, people)

          # Add app-facing sources for the 2026 Overture 37 actions.
          sources_path = 'data/sources.json'
          sources = load(sources_path)
          new_sources = [
              {
                  'id': 'src-ga53-overture37-2026',
                  'title': '53rd General Assembly Overture 37: Amend BCO 9-3 to Allow Women to Serve as Ordained Deacons',
                  'publisher': 'Presbyterian Church in America General Assembly',
                  'date': '2026',
                  'url': 'https://pcaga.org/wp-content/uploads/2026/02/Overture-37_Pacific_9-3.pdf',
                  'source_type': 'primary_denominational_overture',
                  'accessed': '2026-09-14',
                  'notes': 'Official overture from Pacific Presbytery. The document names the presbytery as submitting body; it does not name Jeffrey Choi as author or drafter.'
              },
              {
                  'id': 'src-ga53-overture37-dissent-2026',
                  'title': 'Dissent from the Actions of General Assembly Regarding Overture 37 (Pacific Presbytery)',
                  'publisher': '53rd General Assembly dissent document, hosted by byFaith',
                  'date': '2026-09',
                  'url': 'https://byfaithonline.com/wp-content/uploads/2026/09/Sufficiency_dissent_v3.pdf',
                  'source_type': 'primary_denominational_dissent',
                  'accessed': '2026-09-14',
                  'notes': 'Names TEs Aaron Baker, Jeffrey Choi, Walter Henegar, and Eric Kapur as submitters of the formal dissent.'
              },
              {
                  'id': 'src-reformeddeacon-overture37-2026',
                  'title': 'Women Deacons at the 2026 PCA General Assembly',
                  'publisher': 'ReformedDeacon.com',
                  'author': 'Tim Hopper',
                  'date': '2026-07-22',
                  'url': 'https://reformeddeacon.com/blog/women-deacons-at-the-2026-pca-general-assembly/',
                  'source_type': 'contemporaneous_secondary_report',
                  'accessed': '2026-09-14',
                  'notes': 'Detailed contemporaneous report identifying TE Jeffrey Choi as speaking for Overture 37 on the Assembly floor. Used for the floor-speech claim only, not for overture authorship.'
              },
              {
                  'id': 'src-byfaith-overture37-dissent-response-2026',
                  'title': 'General Assembly Responds to Dissent Regarding Overture 37',
                  'publisher': 'byFaith',
                  'date': '2026-09-09',
                  'url': 'https://byfaithonline.com/general-assembly-responds-to-dissent-regarding-overture-37/',
                  'source_type': 'denominational_news',
                  'accessed': '2026-09-14',
                  'notes': 'Confirms Pacific Presbytery submitted Overture 37, the 115-14-1 Overtures Committee recommendation, Assembly rejection, and the four named dissent authors.'
              },
          ]
          existing_sources = {row['id'] for row in sources}
          collisions = existing_sources & {row['id'] for row in new_sources}
          if collisions:
              raise SystemExit(f'source ids already exist: {sorted(collisions)}')
          sources.extend(new_sources)
          save(sources_path, sources)

          # Add app-facing events.
          events_path = 'data/events.json'
          events = load(events_path)
          new_events = [
              {
                  'id': 'evt-overture37-women-deacons-2026',
                  'name': '53rd GA Overture 37 on women serving as ordained deacons',
                  'event_type': 'general_assembly_overture',
                  'year': 2026,
                  'source_ids': ['src-ga53-overture37-2026', 'src-byfaith-overture37-dissent-response-2026'],
                  'notes': 'Pacific Presbytery formally submitted Overture 37. The Overtures Committee recommended answering it in the negative 115-14-1, and the Assembly adopted that recommendation. Jeffrey Choi is separately modeled as a public advocate/floor speaker, not as the formal sponsor or sole author.'
              },
              {
                  'id': 'evt-overture37-dissent-2026',
                  'name': 'Formal dissent from the 53rd GA action on Overture 37',
                  'event_type': 'general_assembly_dissent',
                  'year': 2026,
                  'source_ids': ['src-ga53-overture37-dissent-2026', 'src-byfaith-overture37-dissent-response-2026'],
                  'notes': 'Formal dissent submitted by TEs Aaron Baker, Jeffrey Choi, Walter Henegar, and Eric Kapur after the Assembly answered Overture 37 in the negative.'
              },
          ]
          existing_events = {row['id'] for row in events}
          collisions = existing_events & {row['id'] for row in new_events}
          if collisions:
              raise SystemExit(f'event ids already exist: {sorted(collisions)}')
          events.extend(new_events)
          save(events_path, events)

          # Add app-facing committee edges and Choi's distinct 2026 formal actions.
          affiliations_path = 'data/affiliations.json'
          affiliations = load(affiliations_path)
          new_affiliations = [
              {
                  'id': 'aff-castro-women-serving-2017',
                  'person_id': 'william-castro',
                  'target_type': 'event',
                  'target_id': 'evt-women-serving-study-committee-2017',
                  'role': 'Advisory Member',
                  'confidence': 'confirmed',
                  'evidence_kind': 'study_committee_service',
                  'weight': 0,
                  'score_included': False,
                  'source_ids': ['src-ga45-women-serving-2017'],
                  'notes': 'Committee service only. This edge does not assign every report-level position or either internal school of thought to William Castro.'
              },
              {
                  'id': 'aff-jones-women-serving-2017',
                  'person_id': 'lani-jones',
                  'target_type': 'event',
                  'target_id': 'evt-women-serving-study-committee-2017',
                  'role': 'Advisory Member',
                  'confidence': 'confirmed',
                  'evidence_kind': 'study_committee_service',
                  'weight': 0,
                  'score_included': False,
                  'source_ids': ['src-ga45-women-serving-2017'],
                  'notes': 'Committee service only. This edge does not assign every report-level position or either internal school of thought to Lani Jones.'
              },
              {
                  'id': 'aff-choi-overture37-floor-2026',
                  'person_id': 'jeffrey-choi',
                  'target_type': 'event',
                  'target_id': 'evt-overture37-women-deacons-2026',
                  'role': 'Floor speaker in support',
                  'confidence': 'strongly_supported',
                  'evidence_kind': 'general_assembly_floor_advocacy',
                  'weight': 0,
                  'score_included': False,
                  'source_ids': ['src-reformeddeacon-overture37-2026'],
                  'notes': 'Contemporaneous reporting identifies Choi as speaking for the overture. Pacific Presbytery is the formal submitting body; personal authorship or sole orchestration is not established by the current primary record.'
              },
              {
                  'id': 'aff-choi-overture37-dissent-2026',
                  'person_id': 'jeffrey-choi',
                  'target_type': 'event',
                  'target_id': 'evt-overture37-dissent-2026',
                  'role': 'Co-author and submitter of formal dissent',
                  'confidence': 'confirmed',
                  'evidence_kind': 'formal_dissent_author',
                  'weight': 3,
                  'score_included': True,
                  'source_ids': ['src-ga53-overture37-dissent-2026', 'src-byfaith-overture37-dissent-response-2026'],
                  'notes': 'The primary dissent names Jeffrey Choi with Aaron Baker, Walter Henegar, and Eric Kapur as submitters. This is scored as a formal person-specific denominational action, distinct from committee service and floor advocacy.'
              },
          ]
          existing_affiliations = {row['id'] for row in affiliations}
          collisions = existing_affiliations & {row['id'] for row in new_affiliations}
          if collisions:
              raise SystemExit(f'affiliation ids already exist: {sorted(collisions)}')
          affiliations.extend(new_affiliations)
          save(affiliations_path, affiliations)
          PY

      - name: Regenerate identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Commit generated data
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data sources/normalized analysis/overlap
          git commit -m 'complete 2017 committee identities and add Choi Overture 37 actions'
          git push
