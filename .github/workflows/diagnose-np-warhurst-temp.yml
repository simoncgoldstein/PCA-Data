name: Diagnose NP Warhurst residual (temporary)

on:
  push:
    paths:
      - '.github/diagnose-np-warhurst.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Print NP Warhurst unresolved exact-name keys
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/overlap/pairwise-shared-people.json').read_text())
          for row in p['pairs_with_confirmed_or_possible_overlap']:
              if {row['dataset_a'],row['dataset_b']}=={'national_partnership_confirmed_members','warhurst_protest_2019'}:
                  print('UNRESOLVED_KEYS=', row['unresolved_exact_name_keys'])
                  print('CONFIRMED_COUNT=', len(row['confirmed_shared_people']))
                  break
          else:
              print('PAIR_NOT_FOUND')
          PY
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with Path('analysis/overlap/pairwise-overlap.csv').open() as f:
              for row in csv.DictReader(f):
                  if {row['dataset_a'],row['dataset_b']}=={'national_partnership_confirmed_members','warhurst_protest_2019'}:
                      print('CSV_UNRESOLVED_COUNT=',row['unresolved_possible_overlap_count'])
                      print('CSV_CONFIRMED_COUNT=',row['confirmed_intersection_count'])
                      break
          PY
