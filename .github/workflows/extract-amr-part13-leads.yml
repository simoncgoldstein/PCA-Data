name: Extract AMR Parts 1 and 3 leads
on:
  push:
    branches: [research/amr-overtures-part13-2026-09-04]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/amr-overtures-part13-2026-09-04
      - name: Extract bounded candidate passages
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          files={
            'part1':'sources/raw/media/amr/youtube-2026-09-03/captions/xezEYJN8aiM-en-auto-1.vtt',
            'part3':'sources/raw/media/amr/youtube-2026-09-03/captions/cxQxeng9eow-en-auto-1.vtt',
          }
          issue_terms=('overture','original jurisdiction','judicial','assistant pastor','ruling elder','nominating','committee','agency','indictment','complaint','court','assembly','deacon','ordination','office','rao','bco')
          stance_terms=("i think","i don't think","i do think","i'm opposed","i oppose","i support","i favor","i'm in favor","i'm not in favor","i like","i don't like","i would vote","vote no","vote yes","should pass","should not pass","ought to","should be")
          def sec(ts):
            h,m,s=ts.replace(',','.').split(':'); return int(h)*3600+int(m)*60+float(s)
          def fmt(x):
            h=int(x//3600); m=int((x%3600)//60); s=x%60
            return f'{h:02d}:{m:02d}:{s:06.3f}'
          out={}
          for label,path in files.items():
            raw=Path(path).read_text(errors='ignore')
            cues=[]
            for block in re.split(r'\n\s*\n',raw):
              lines=[x.strip() for x in block.splitlines() if x.strip()]
              if not lines: continue
              ti=next((i for i,x in enumerate(lines) if '-->' in x),None)
              if ti is None: continue
              m=re.match(r'(\d\d:\d\d:\d\d[\.,]\d+)\s+-->',lines[ti])
              if not m: continue
              text=' '.join(lines[ti+1:])
              text=re.sub(r'<[^>]+>','',text).replace('&gt;','>')
              text=re.sub(r'\s+',' ',text).strip()
              if text: cues.append((sec(m.group(1)),text))
            # de-dupe repeated rolling auto-caption lines
            compact=[]
            for t,text in cues:
              if compact and text==compact[-1][1]: continue
              compact.append((t,text))
            candidates=[]
            for i,(t,text) in enumerate(compact):
              lo=text.lower()
              if any(s in lo for s in stance_terms) and any(k in lo for k in issue_terms):
                a=max(0,i-3); b=min(len(compact),i+6)
                window=' '.join(x[1] for x in compact[a:b])
                candidates.append({'timestamp':fmt(t),'text':window[:1800]})
            # keep unique windows, max 30/video
            seen=set(); uniq=[]
            for c in candidates:
              key=c['text'][:250]
              if key in seen: continue
              seen.add(key); uniq.append(c)
            out[label]=uniq[:30]
          Path('research/amr-part13-candidate-passages.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Remove workflow and commit candidates
        run: |
          rm .github/workflows/extract-amr-part13-leads.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/amr-part13-candidate-passages.json .github/workflows/extract-amr-part13-leads.yml
          git commit -m "Extract AMR Parts 1 and 3 candidate passages"
          git push
