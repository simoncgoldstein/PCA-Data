name: Finalize formal position batch 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'research/formal-position-mining-batch1-2026-09-04'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add reviewed name-variant resolution and office fidelity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-person-crosswalk.py')
          text = path.read_text()

          variants_anchor = 'FIRST_NAME_VARIANTS = {\n'
          if 'REVIEWED_NAME_VARIANTS = {' not in text:
              end_marker = '}\n\n\ndef ascii_words'
              pos = text.index(end_marker)
              insertion = '''}\n\n# Explicit reviewed name-form equivalences. These are person-specific evidence\n# decisions, not a general nickname-merging rule. Printed names remain intact.\nREVIEWED_NAME_VARIANTS = {\n    "michael mclaughlin": {\n        "canonical_candidate": "mike mclaughlin",\n        "canonical_display_name": "Mike McLaughlin",\n        "evidence_receipt": "sources/raw/identity/mike-michael-mclaughlin-resolution-2026-09-04.json",\n        "note": "Official 2009 Southwest Presbytery evidence plus City Presbyterian Albuquerque's first-party history connects Michael/Mike McLaughlin from the Albuquerque church plant to his later move back to Missouri.",\n    },\n}\n\n\ndef ascii_words'''
              text = text[:pos] + insertion + text[pos + len(end_marker):]

          old = '''    candidate = normalize_name(printed_name)\n    valid_existing_id = None\n'''
          new = '''    printed_candidate = normalize_name(printed_name)\n    reviewed_variant = REVIEWED_NAME_VARIANTS.get(printed_candidate)\n    candidate = reviewed_variant["canonical_candidate"] if reviewed_variant else printed_candidate\n    valid_existing_id = None\n'''
          if old not in text:
              raise SystemExit('candidate anchor missing')
          text = text.replace(old, new, 1)

          old = '''        "normalized_candidate": candidate,\n        "source_tier": source_tier,\n'''
          new = '''        "normalized_candidate": candidate,\n        "normalized_name_as_printed": printed_candidate,\n        "reviewed_name_variant": reviewed_variant,\n        "source_tier": source_tier,\n'''
          if old not in text:
              raise SystemExit('record anchor missing')
          text = text.replace(old, new, 1)

          old = '''            presbyteries=[row.get("presbytery_as_printed")],\n            existing_id=row.get("normalized_person_id"),\n            backfill=False,\n'''
          new = '''            presbyteries=[row.get("presbytery_as_printed")],\n            office=(row.get("office_as_printed") or (row["name_as_printed"].split()[0] if row["name_as_printed"].split()[0] in {"TE", "RE"} else None)),\n            existing_id=row.get("normalized_person_id"),\n            backfill=False,\n'''
          if old not in text:
              raise SystemExit('formal position office anchor missing')
          text = text.replace(old, new, 1)

          old = '''        preferred = max((display_name(r["name_as_printed"]) for r in rows), key=lambda x: (len(normalize_name(x).split()), len(x), x))\n        candidate_id = slug(preferred)\n'''
          new = '''        preferred = max((display_name(r["name_as_printed"]) for r in rows), key=lambda x: (len(normalize_name(x).split()), len(x), x))\n        reviewed_variant_rows = [r for r in rows if r.get("reviewed_name_variant")]\n        if reviewed_variant_rows:\n            preferred = reviewed_variant_rows[0]["reviewed_name_variant"]["canonical_display_name"]\n        candidate_id = slug(preferred)\n'''
          if old not in text:
              raise SystemExit('preferred-name anchor missing')
          text = text.replace(old, new, 1)

          old = '''        if canonical_id and not row.get("existing_id") and not manual:\n            if not any(rows_share_context(row, peer) for peer in rows if peer is not row):\n'''
          new = '''        if canonical_id and row.get("reviewed_name_variant"):\n            row_status = "context_confirmed"\n            row_method = "documented_reviewed_name_variant"\n            row_confidence = 0.98\n            row_note = row["reviewed_name_variant"]["note"]\n\n        if canonical_id and not row.get("existing_id") and not manual and not row.get("reviewed_name_variant"):\n            if not any(rows_share_context(row, peer) for peer in rows if peer is not row):\n'''
          if old not in text:
              raise SystemExit('row guard anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Rebuild and validate all generated outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .
          python3 scripts/validate-formal-position-evidence.py .
          python3 scripts/validate-research-imports.py .

      - name: Remove one-time workflow and commit exact generated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-formal-position-batch1.yml
          git add -A
          git status --short
          git commit -m 'Finalize formal position identity integration'
          git push origin HEAD:${{ github.head_ref }}
