name: Fix Garris anchor inheritance (temporary)

on:
  push:
    paths:
      - '.github/fix-garris-anchor-inheritance.trigger'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tighten reviewed-anchor identity inheritance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-person-crosswalk.py')
          text = path.read_text(encoding='utf-8')
          override_anchor = '    ("a_faithful_pca_2022-03-14", "signature:6"): "andrew-augenstein",\n'
          override_insert = (
              override_anchor
              + '    # Letter 1 and Letter 2 contain different Jeff Whites by printed context.\n'
              + '    # A prior generated backfill must not turn the Letter 1 Rio Grande row\n'
              + '    # into the reviewed Redeemer Downtown / Metro NY identity.\n'
              + '    ("garris_letter_1", "garris-letter-1:signer:58"): "jeff-white-redeemer-downtown",\n'
          )
          if 'garris-letter-1:signer:58' not in text:
              text = text.replace(override_anchor, override_insert, 1)
          old = '        if seed_name_matches or manual_name_matches:\n            valid_existing_id = existing_id\n'
          new = '        if rejected_existing_id == existing_id:\n            valid_existing_id = None\n        elif seed_name_matches or manual_name_matches:\n            valid_existing_id = existing_id\n'
          if 'if rejected_existing_id == existing_id:' not in text:
              text = text.replace(old, new, 1)
          old = '            if not any(rows_share_context(row, peer) for peer in rows if peer is not row):\n'
          new = (
              '            candidate_peers = [peer for peer in rows if peer is not row]\n'
              '            if method == "preexisting_verified_id":\n'
              '                candidate_peers = [\n'
              '                    peer for peer in candidate_peers\n'
              '                    if peer.get("existing_id") == canonical_id\n'
              '                ]\n'
              '            if not any(rows_share_context(row, peer) for peer in candidate_peers):\n'
          )
          if 'candidate_peers = [peer for peer in rows if peer is not row]' not in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Diagnose conservative rebuild
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('sources/normalized/public-statements/garris-letters-2024.json').read_text())
          for letter in data['letters']:
              unresolved = [
                  (r['print_order'], r['name_as_printed'], r.get('institution_as_printed'), r.get('presbytery_as_printed'))
                  for r in letter['signers'] if not r.get('normalized_person_id')
              ]
              print(letter['letter_id'], 'unresolved=', len(unresolved))
              for row in unresolved:
                  print('  ', row)
          PY
          exit 1
