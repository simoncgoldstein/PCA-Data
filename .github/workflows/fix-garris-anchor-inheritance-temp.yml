name: Fix Garris anchor inheritance (temporary)

on:
  push:
    paths:
      - '.github/fix-garris-anchor-inheritance.trigger'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tighten reviewed-anchor identity inheritance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-person-crosswalk.py')
          text = path.read_text(encoding='utf-8')

          override_anchor = '    ("a_faithful_pca_2022-03-14", "signature:6"): "andrew-augenstein",\n'
          override_insert = (
              override_anchor
              + '    # Letter 1 and Letter 2 contain different Jeff Whites by printed context.\n'
              + '    # A prior generated backfill must not turn the Letter 1 Rio Grande row\n'
              + '    # into the reviewed Redeemer Downtown / Metro NY identity.\n'
              + '    ("garris_letter_1", "garris-letter-1:signer:58"): "jeff-white-redeemer-downtown",\n'
          )
          if 'garris-letter-1:signer:58' not in text:
              if override_anchor not in text:
                  raise SystemExit('override insertion anchor drift')
              text = text.replace(override_anchor, override_insert, 1)

          old = (
              '        if seed_name_matches or manual_name_matches:\n'
              '            valid_existing_id = existing_id\n'
          )
          new = (
              '        if rejected_existing_id == existing_id:\n'
              '            valid_existing_id = None\n'
              '        elif seed_name_matches or manual_name_matches:\n'
              '            valid_existing_id = existing_id\n'
          )
          if 'if rejected_existing_id == existing_id:' not in text:
              if old not in text:
                  raise SystemExit('existing-id validation anchor drift')
              text = text.replace(old, new, 1)

          old = '            if not any(rows_share_context(row, peer) for peer in rows if peer is not row):\n'
          new = (
              '            candidate_peers = [peer for peer in rows if peer is not row]\n'
              '            if method == "preexisting_verified_id":\n'
              '                # Reviewed anchors propagate only through context shared with an anchored row.\n'
              '                candidate_peers = [\n'
              '                    peer for peer in candidate_peers\n'
              '                    if peer.get("existing_id") == canonical_id\n'
              '                ]\n'
              '            if not any(rows_share_context(row, peer) for peer in candidate_peers):\n'
          )
          if 'candidate_peers = [peer for peer in rows if peer is not row]' not in text:
              if old not in text:
                  raise SystemExit('row-level inheritance anchor drift')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild canonical identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 scripts/build-overlap-analysis.py .
          python3 scripts/validate-garris-letter-signers.py .

      - name: Commit corrected generated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'tighten reviewed identity anchor inheritance'
          git push
