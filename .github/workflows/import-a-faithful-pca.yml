name: Import A Faithful PCA signer roster

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-a-faithful-pca.yml'
      - 'scripts/parse-a-faithful-pca.py'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download preserved Wayback signer PDF
        run: |
          mkdir -p sources/raw/public-statements/a-faithful-pca
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 PCA-Data research archive' \
            'https://warhornmedia.com/wp-content/uploads/2022/09/Signatures-%E2%80%94-A-Faithful-PCA.pdf' \
            --output sources/raw/public-statements/a-faithful-pca/signatures-wayback-2021-06-11.pdf

      - name: Extract PDF text
        run: |
          pdftotext -layout \
            sources/raw/public-statements/a-faithful-pca/signatures-wayback-2021-06-11.pdf \
            sources/raw/public-statements/a-faithful-pca/signatures-wayback-2021-06-11.txt

      - name: Parse 571 signer records
        run: |
          python scripts/parse-a-faithful-pca.py \
            sources/raw/public-statements/a-faithful-pca/signatures-wayback-2021-06-11.txt \
            sources/normalized/public-statements/a-faithful-pca-signers-2021.json

      - name: Commit source receipts and normalized roster
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sources/raw/public-statements/a-faithful-pca/signatures-wayback-2021-06-11.pdf \
            sources/raw/public-statements/a-faithful-pca/signatures-wayback-2021-06-11.txt \
            sources/normalized/public-statements/a-faithful-pca-signers-2021.json
          git commit -m 'import A Faithful PCA signer roster'
          git push
