name: Import Save the PCA FFO dataset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-ffo.yml'
      - 'scripts/import-ffo-xlsx.py'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download versioned FFO workbook
        run: |
          mkdir -p sources/raw/external-datasets/save-the-pca-ffo
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 PCA-Data research archive' \
            'https://www.savethepca.com/wp-content/uploads/2026/02/ffo_public_dataset_020826.xlsx' \
            --output sources/raw/external-datasets/save-the-pca-ffo/ffo_public_dataset_020826.xlsx

      - name: Normalize workbook
        run: |
          python scripts/import-ffo-xlsx.py \
            sources/raw/external-datasets/save-the-pca-ffo/ffo_public_dataset_020826.xlsx \
            sources/normalized/external-datasets/save-the-pca-ffo/2026-02-08

      - name: Commit source workbook and extracts
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sources/raw/external-datasets/save-the-pca-ffo/ffo_public_dataset_020826.xlsx \
            sources/normalized/external-datasets/save-the-pca-ffo/2026-02-08/
          git commit -m 'import Save the PCA FFO dataset 2026-02-08'
          git push
