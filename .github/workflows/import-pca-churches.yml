name: Import PCA church directory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-pca-churches.yml'
      - 'scripts/import-pca-church-kml.mjs'
      - 'data/presbyteries.json'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official PCA BatchGeo KML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/raw/institutions/pca-church-directory
          OUT='sources/raw/institutions/pca-church-directory/pca-churches-2026-09-03.kml'
          URLS=(
            'https://www.batchgeo.com/map/kml/fed353c376144b1fed2f5e29150c2531'
            'https://batchgeo.com/map/kml/fed353c376144b1fed2f5e29150c2531'
            'https://direct.batchgeo.com/map/kml/fed353c376144b1fed2f5e29150c2531'
            'https://api.batchgeo.com/map/kml/fed353c376144b1fed2f5e29150c2531'
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "Trying $url"
            if curl --fail --location --retry 2 \
              --compressed \
              --header 'Accept: application/vnd.google-earth.kml+xml,application/xml,text/xml,*/*' \
              --header 'Accept-Language: en-US,en;q=0.9' \
              --header 'Referer: https://www.pcaac.org/church-directory/' \
              --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
              "$url" --output "$OUT"; then
              if grep -q '<Placemark>' "$OUT"; then
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo 'BatchGeo blocked all server-side KML download attempts.' >&2
            exit 22
          fi
          echo "Downloaded $(wc -c < "$OUT") bytes"

      - name: Normalize church directory
        run: node scripts/import-pca-church-kml.mjs sources/raw/institutions/pca-church-directory/pca-churches-2026-09-03.kml

      - name: Validate structured data
        run: node scripts/validate-data.mjs

      - name: Commit generated source snapshot and data
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/churches.json \
            sources/raw/institutions/pca-church-directory/pca-churches-2026-09-03.kml \
            sources/normalized/church-directory/
          git commit -m 'import PCA church directory snapshot'
          git push
