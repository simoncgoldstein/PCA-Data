name: Import PCA church directory

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-pca-churches.yml'
      - 'scripts/import-pca-church-kml.mjs'
      - 'data/presbyteries.json'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official PCA BatchGeo KML
        run: |
          mkdir -p sources/raw/institutions/pca-church-directory
          curl --fail --location --retry 3 \
            --user-agent 'Mozilla/5.0 PCA-Data research archive' \
            'https://batchgeo.com/map/kml/fed353c376144b1fed2f5e29150c2531' \
            --output sources/raw/institutions/pca-church-directory/pca-churches-2026-09-03.kml

      - name: Normalize church directory
        run: node scripts/import-pca-church-kml.mjs sources/raw/institutions/pca-church-directory/pca-churches-2026-09-03.kml

      - name: Validate structured data
        run: node scripts/validate-data.mjs

      - name: Commit generated source snapshot and data
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/churches.json \
            sources/raw/institutions/pca-church-directory/pca-churches-2026-09-03.kml \
            sources/normalized/church-directory/
          git commit -m 'import PCA church directory snapshot'
          git push
