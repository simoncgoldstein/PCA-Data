name: Integrate subscription and Federal Vision Batch 4

on:
  push:
    branches: [research/subscription-fv-batch4-2026-09-04]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/subscription-fv-batch4-2026-09-04
      - name: Patch identity builder and formal-position validator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bp = Path('scripts/build-person-crosswalk.py')
          text = bp.read_text()

          old = '''    evidence_type: str,\n    presbyteries: list[str] | None = None,\n'''
          new = '''    evidence_type: str,\n    matching_name: str | None = None,\n    presbyteries: list[str] | None = None,\n'''
          if old not in text:
              raise SystemExit('builder matching_name signature anchor missing')
          text = text.replace(old, new, 1)

          old = '''    printed_candidate = normalize_name(printed_name)\n    reviewed_variant = REVIEWED_NAME_VARIANTS.get(printed_candidate)\n    candidate = reviewed_variant["canonical_candidate"] if reviewed_variant else printed_candidate\n'''
          new = '''    printed_candidate = normalize_name(printed_name)\n    matching_candidate = normalize_name(matching_name) if matching_name else printed_candidate\n    reviewed_variant = REVIEWED_NAME_VARIANTS.get(matching_candidate)\n    candidate = reviewed_variant["canonical_candidate"] if reviewed_variant else matching_candidate\n'''
          if old not in text:
              raise SystemExit('builder candidate anchor missing')
          text = text.replace(old, new, 1)

          old = '''        "normalized_candidate": candidate,\n        "normalized_name_as_printed": printed_candidate,\n'''
          new = '''        "normalized_candidate": candidate,\n        "normalized_name_as_printed": printed_candidate,\n        "normalized_matching_name": matching_candidate,\n'''
          if old not in text:
              raise SystemExit('builder public record anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''# 2001-2002 Women in the Military study-committee evidence. All committee,\n'''
          if anchor not in text:
              raise SystemExit('builder insertion anchor missing')
          snippet = r'''# 2003 Good Faith Subscription person-level evidence. Every action below is
# drawn from the same 31st General Assembly journal and therefore shares one
# source family; repeated appearance in a vote, protest, or report cannot
# self-corroborate a new identity.
relative = "sources/normalized/general-assembly/2003-subscription-formal-position-records.json"
subscription2003 = register_json(relative)
family2003 = "ga_2003_subscription_formal_positions"

vote_block = subscription2003["bco_21_4_recorded_negative_votes"]
for row in vote_block.get("votes", []):
    add_record(
        dataset="bco_21_4_negative_votes_2003",
        family=family2003,
        source_path=relative,
        locator=f"bco21_4_negative:{row['print_order']}",
        printed_name=row["name_as_printed"],
        matching_name=row.get("identity_name"),
        row=row,
        source_tier="official_primary",
        completeness="complete_71_name_primary_roster",
        evidence_type="recorded_negative_vote",
        office=row.get("office_as_printed"),
        existing_id=row.get("normalized_person_id"),
    )

protest = subscription2003["bco_21_4_full_subscription_protest"]
author = protest["author_presenter"]
add_record(
    dataset="bco_21_4_subscription_protest_author_2003",
    family=family2003,
    source_path=relative,
    locator="subscription_protest_author_presenter",
    printed_name=author["name_as_printed"],
    matching_name=author.get("identity_name"),
    row=author,
    source_tier="official_primary",
    completeness="complete_named_author_presenter",
    evidence_type="formal_protest_author_presenter",
    office=author.get("office_as_printed"),
    existing_id=author.get("normalized_person_id"),
)
for row in protest.get("joiners", []):
    add_record(
        dataset="bco_21_4_subscription_protest_joiners_2003",
        family=family2003,
        source_path=relative,
        locator=f"subscription_protest_joiner:{row['print_order']}",
        printed_name=row["name_as_printed"],
        matching_name=row.get("identity_name"),
        row=row,
        source_tier="official_primary",
        completeness="complete_93_joiner_primary_roster",
        evidence_type="formal_protest_signature",
        office=row.get("office_as_printed"),
        existing_id=row.get("normalized_person_id"),
    )

minority = subscription2003["overture_16_subscription_study_minority_report"]
for row in minority.get("signers", []):
    add_record(
        dataset="subscription_overture_16_minority_report_2003",
        family=family2003,
        source_path=relative,
        locator=f"overture16_minority_signer:{row['print_order']}",
        printed_name=row["name_as_printed"],
        matching_name=row.get("identity_name"),
        row=row,
        source_tier="official_primary",
        completeness="complete_14_signer_primary_roster",
        evidence_type="minority_report_signature",
        office=row.get("office_as_printed"),
        existing_id=row.get("normalized_person_id"),
    )

single_vote = subscription2003["overture_16_minority_report_recorded_negative_vote"]["voter"]
add_record(
    dataset="subscription_overture_16_negative_vote_2003",
    family=family2003,
    source_path=relative,
    locator="overture16_adopted_minority_negative_vote",
    printed_name=single_vote["name_as_printed"],
    matching_name=single_vote.get("identity_name"),
    row=single_vote,
    source_tier="official_primary",
    completeness="complete_single_recorded_vote",
    evidence_type="recorded_negative_vote",
    office=single_vote.get("office_as_printed"),
    existing_id=single_vote.get("normalized_person_id"),
)


# 2007 Federal Vision / New Perspective / Auburn Avenue committee. The report
# explicitly says the nine declarations are unanimous, so committee service is
# stronger than generic membership here. It remains a separate source family
# from later votes, networks, or institutional roles.
relative = "sources/normalized/general-assembly/2002-2007-subscription-federal-vision-chronology.json"
fv_chronology = register_json(relative)
fv_report = next(e for e in fv_chronology["events"] if e["event_id"] == "2007-fv-npp-study-report")
for index, row in enumerate(fv_report.get("committee_members", []), 1):
    add_record(
        dataset="federal_vision_study_committee_2007",
        family="ga_2007_fv_npp_study_report",
        source_path=relative,
        locator=f"committee_member:{index}",
        printed_name=row["name_as_printed"],
        row=row,
        source_tier="official_primary",
        completeness="complete_7_member_unanimous_report_roster",
        evidence_type="unanimous_study_committee_report",
        office=row.get("office_as_printed"),
        existing_id=row.get("normalized_person_id"),
    )


'''
          text = text.replace(anchor, snippet + anchor, 1)
          bp.write_text(text)

          vp = Path('scripts/validate-formal-position-evidence.py')
          v = vp.read_text()
          load_anchor = '''women2016 = json.loads(women2016_path.read_text(encoding="utf-8"))\n'''
          load_new = load_anchor + '''subscription2003_path = root / "sources/normalized/general-assembly/2003-subscription-formal-position-records.json"\nsubscription2003 = json.loads(subscription2003_path.read_text(encoding="utf-8"))\nsubscription_fv_path = root / "sources/normalized/general-assembly/2002-2007-subscription-federal-vision-chronology.json"\nsubscription_fv = json.loads(subscription_fv_path.read_text(encoding="utf-8"))\nsubscription2002_gap_path = root / "sources/raw/general-assembly/2002-subscription-negative-vote-roster-gap-2026-09-04.json"\nsubscription2002_gap = json.loads(subscription2002_gap_path.read_text(encoding="utf-8"))\n'''
          if load_anchor not in v:
              raise SystemExit('validator load anchor missing')
          v = v.replace(load_anchor, load_new, 1)

          check_anchor = '''# 2001-2002 Women in the Military report family.\n'''
          checks = r'''# 2002-2007 Good Faith Subscription / Federal Vision formal-position family.
sm = subscription2003.get("metadata", {})
if sm.get("ideological_weight") != 0:
    raise SystemExit("2003 subscription: ideological_weight must remain 0")
discrepancy = sm.get("count_discrepancy", {})
if discrepancy.get("primary_minutes_recorded_negative_vote_count") != 71 or discrepancy.get("pca_digest_recorded_negative_vote_count") != 70 or discrepancy.get("controlling_count") != 71:
    raise SystemExit("2003 subscription: primary-minutes/Digest count discrepancy guardrail drift")
if sm.get("source_family") != "ga_2003_subscription_formal_positions":
    raise SystemExit("2003 subscription: same-journal source-family guardrail drift")

votes2003 = subscription2003.get("bco_21_4_recorded_negative_votes", {})
if votes2003.get("vote_count") != 71 or len(votes2003.get("votes", [])) != 71:
    raise SystemExit("2003 subscription: expected 71 primary recorded negative votes")
if len({r.get("name_as_printed") for r in votes2003.get("votes", [])}) != 71:
    raise SystemExit("2003 subscription: recorded-negative-vote names must be unique")

protest2003 = subscription2003.get("bco_21_4_full_subscription_protest", {})
if protest2003.get("author_presenter", {}).get("name_as_printed") != "Morton H. Smith":
    raise SystemExit("2003 subscription protest: Morton H. Smith author/presenter missing")
if protest2003.get("joiner_count") != 93 or len(protest2003.get("joiners", [])) != 93:
    raise SystemExit("2003 subscription protest: expected 93 additional joiners")
if any(r.get("name_as_printed") == "Morton H. Smith" for r in protest2003.get("joiners", [])):
    raise SystemExit("2003 subscription protest: author must remain distinct from 93 joiners")

minority2003 = subscription2003.get("overture_16_subscription_study_minority_report", {})
if minority2003.get("signer_count") != 14 or len(minority2003.get("signers", [])) != 14:
    raise SystemExit("2003 Overture 16 minority: expected 14 signers")
if minority2003.get("assembly_vote_on_minority_report") != {"for": 530, "against": 477}:
    raise SystemExit("2003 Overture 16 minority: 530-477 Assembly tally drift")
single2003 = subscription2003.get("overture_16_minority_report_recorded_negative_vote", {})
if single2003.get("vote_count") != 1 or single2003.get("voter", {}).get("name_as_printed") != "Chris A. Hutchinson":
    raise SystemExit("2003 Overture 16 minority: Chris A. Hutchinson recorded negative vote missing")

if subscription2002_gap.get("recorded_negative_vote_count") != 127 or subscription2002_gap.get("names_recovered") is not False:
    raise SystemExit("2002 subscription: preserve 127-vote event-level gap without invented names")

sfv_events = {e.get("event_id"): e for e in subscription_fv.get("events", [])}
rat2003 = sfv_events.get("2003-good-faith-subscription-ratification", {})
if rat2003.get("recorded_negative_vote_count") != 71:
    raise SystemExit("2003 subscription chronology: primary count must be 71")
if rat2003.get("count_discrepancy") != {"primary_minutes": 71, "pca_digest": 70, "controlling_count": 71, "note": "Original 31st GA minutes control over later Digest summary."}:
    raise SystemExit("2003 subscription chronology: discrepancy metadata drift")

fv2007 = sfv_events.get("2007-fv-npp-study-report", {})
if fv2007.get("committee_member_count") != 7 or len(fv2007.get("committee_members", [])) != 7:
    raise SystemExit("2007 FV/NPP report: expected 7 committee members")
expected_fv_names = {"Paul Fowler", "Grover Gunn", "Ligon Duncan", "Sean Lucas", "Robert Mattes", "William Mueller", "John White"}
if {r.get("name_as_printed") for r in fv2007.get("committee_members", [])} != expected_fv_names:
    raise SystemExit("2007 FV/NPP report: committee roster drift")
if fv2007.get("declaration_consensus") != "unanimous" or len(fv2007.get("declarations", [])) != 9:
    raise SystemExit("2007 FV/NPP report: unanimous nine-declaration guardrail drift")
if len(fv2007.get("committee_recommendations", [])) != 5:
    raise SystemExit("2007 FV/NPP report: expected five recommendations")
if fv2007.get("ideological_weight") != 0:
    raise SystemExit("2007 FV/NPP report: ideological_weight must remain 0")

'''
          if check_anchor not in v:
              raise SystemExit('validator checks anchor missing')
          v = v.replace(check_anchor, checks + check_anchor, 1)

          required_anchor = '''    "2001-wim-consensus-report",\n'''
          required_new = '''    "2003-bco-21-4-recorded-negative-votes",\n    "2003-bco-21-4-full-subscription-protest",\n    "2003-subscription-study-minority-report",\n    "2003-subscription-overture-16-recorded-negative-vote",\n    "2007-fv-npp-unanimous-study-report",\n''' + required_anchor
          if required_anchor not in v:
              raise SystemExit('validator index required anchor missing')
          v = v.replace(required_anchor, required_new, 1)
          vp.write_text(v)
          PY

      - name: Rebuild generated identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Validate integrated batch
        run: |
          python3 scripts/validate-formal-position-evidence.py .
          node scripts/validate-data.mjs
          python3 scripts/validate-research-imports.py .

      - name: Commit integrated outputs
        shell: bash
        run: |
          rm .github/workflows/integrate-subscription-fv-batch4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate subscription and Federal Vision formal-position evidence"
          git push origin HEAD:research/subscription-fv-batch4-2026-09-04
