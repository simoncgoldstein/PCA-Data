name: Integrate Women in the Military formal-position evidence

on:
  push:
    branches: [research/women-worship-formal-position-batch3-2026-09-04]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/women-worship-formal-position-batch3-2026-09-04

      - name: Integrate source family, index, validator, and generated outputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          # Formal-position evidence index.
          ipath=Path('sources/normalized/general-assembly/formal-position-evidence-index.json')
          idx=json.loads(ipath.read_text())
          entries=[
            {
              'evidence_id':'2001-wim-consensus-report',
              'year':2001,
              'topic':'women_in_the_military',
              'evidence_class':'study_committee_consensus_participation',
              'path':'sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json',
              'coverage':'complete 10-member committee roster; Sections I-XI submitted by the entire committee with no dissent',
              'important_boundary':'Consensus participation does not identify which side a committee member held on the unresolved duty-versus-wise-counsel question.'
            },
            {
              'evidence_id':'2001-wim-majority-duty-report',
              'year':2001,
              'topic':'women_in_the_military',
              'evidence_class':'signed_formal_report_or_minority_report',
              'path':'sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json',
              'coverage':'5 named signers of Man’s Duty to Protect Woman',
              'important_boundary':'Establishes the signed duty-position report only, not a generic position on every issue concerning women.'
            },
            {
              'evidence_id':'2001-wim-minority-wise-counsel-report',
              'year':2001,
              'topic':'women_in_the_military',
              'evidence_class':'signed_formal_report_or_minority_report',
              'path':'sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json',
              'coverage':'4 named signers of Recommendations for the Wise Counsel of the Church',
              'important_boundary':'The minority still counseled against women in combat; its dispute was whether the church could bind all consciences by declaring the conclusion a scriptural duty.'
            },
            {
              'evidence_id':'2002-wim-majority-final-recommendations',
              'year':2002,
              'topic':'women_in_the_military',
              'evidence_class':'signed_formal_report_or_minority_report',
              'path':'sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json',
              'coverage':'6 named majority-position report names; Recommendations 1-4 adopted by the 30th General Assembly',
              'important_boundary':'Report signership is direct person-level evidence; the Assembly’s aggregate adoption is not an individual roll call.'
            },
            {
              'evidence_id':'2002-wim-minority-pastoral-counsel',
              'year':2002,
              'topic':'women_in_the_military',
              'evidence_class':'signed_formal_report_or_minority_report',
              'path':'sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json',
              'coverage':'4 named minority-report names; minority substitute defeated',
              'important_boundary':'The four names establish the minority position; no unnamed commissioner’s position is inferred from the Assembly outcome.'
            }
          ]
          existing={x['evidence_id'] for x in idx['normalized_position_sources']}
          for e in entries:
              if e['evidence_id'] not in existing:
                  idx['normalized_position_sources'].append(e)
          # Replace generic WIM backlog with specific unresolved roll call.
          new_backlog=[]
          for item in idx.get('priority_backlog',[]):
              target=item.get('target','')
              if 'Women in the Military' in target:
                  target=target.replace('Women in the Military, ', '')
                  item=dict(item)
                  item['target']=target
              new_backlog.append(item)
          new_backlog.append({
            'priority':1,
            'target':'2002 Women in the Military final-action 77 recorded negative votes',
            'reason':'Official Historical Center HTML confirms the count but does not expose the named roster; recover the names from the 30th GA minutes before treating these as person-level votes.'
          })
          idx['priority_backlog']=new_backlog
          ipath.write_text(json.dumps(idx,indent=2,ensure_ascii=False)+'\n')

          # Identity builder: one source family across all WIM committee/report records.
          bpath=Path('scripts/build-person-crosswalk.py')
          text=bpath.read_text()
          marker='# A Faithful PCA snapshots remain separate datasets but one source family.\n'
          if marker not in text:
              raise SystemExit('identity insertion marker missing')
          block='''# 2001-2002 Women in the Military study-committee evidence. All committee,\n# majority, minority, and named presentation records are one source family so\n# repeated name forms inside the same committee/report history cannot\n# self-corroborate a new identity.\nrelative = "sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json"\nwim_data = register_json(relative)\ncommittee = wim_data["committee_roster"]\nfor row in committee.get("members", []):\n    add_record(\n        dataset="women_military_committee_2001",\n        family="women_military_aic_2001_2002",\n        source_path=relative,\n        locator=f"committee_member:{row['print_order']}",\n        printed_name=row["name_as_printed"],\n        row=row,\n        source_tier="official_primary_transcription",\n        completeness="complete_10_member_roster",\n        evidence_type="study_committee_consensus_service",\n        office=row.get("office_as_printed"),\n        existing_id=row.get("normalized_person_id"),\n    )\nfor event in wim_data.get("formal_positions", []):\n    for row in event.get("signers", []):\n        add_record(\n            dataset=f"formal_position_{event['event_id']}",\n            family="women_military_aic_2001_2002",\n            source_path=relative,\n            locator=f"{event['event_id']}:signer:{row['print_order']}",\n            printed_name=row["name_as_printed"],\n            row=row,\n            source_tier="official_primary_transcription",\n            completeness="complete_named_report_signers",\n            evidence_type="formal_report_signature",\n            office=row.get("office_as_printed"),\n            existing_id=row.get("normalized_person_id"),\n        )\nfor index, row in enumerate(wim_data.get("named_report_roles", []), 1):\n    add_record(\n        dataset="women_military_named_report_roles_2001_2002",\n        family="women_military_aic_2001_2002",\n        source_path=relative,\n        locator=f"named_role:{index}:{row['year']}",\n        printed_name=row["name_as_printed"],\n        row=row,\n        source_tier="official_primary_transcription",\n        completeness="complete_named_roles_in_normalized_report_family",\n        evidence_type="named_report_role",\n        office=row.get("office_as_printed"),\n        existing_id=row.get("normalized_person_id"),\n    )\n\n\n'''
          if 'women_military_committee_2001' not in text:
              text=text.replace(marker,block+marker,1)
          bpath.write_text(text)

          # Formal-position validator.
          vpath=Path('scripts/validate-formal-position-evidence.py')
          v=vpath.read_text()
          load_marker='women2016_path = root / "sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json"\n'
          if 'wim_path' not in v:
              v=v.replace(load_marker,'wim_path = root / "sources/normalized/general-assembly/2001-2002-women-military-formal-position-records.json"\nwim = json.loads(wim_path.read_text(encoding="utf-8"))\n'+load_marker,1)
          hierarchy_marker='hierarchy = {row.get("evidence_class"): row for row in index.get("evidence_hierarchy", [])}\n'
          checks='''# 2001-2002 Women in the Military report family.\nif wim.get("metadata", {}).get("ideological_weight") != 0:\n    raise SystemExit("Women in the Military: ideological_weight must remain 0")\ncommittee = wim.get("committee_roster", {})\nif committee.get("member_count") != 10 or len(committee.get("members", [])) != 10:\n    raise SystemExit("Women in the Military: expected complete 10-member committee roster")\ncommittee_names = {r.get("name_as_printed") for r in committee.get("members", [])}\nif committee_names != {"Stephen Leonard", "Stephen Clark", "Ron Swafford", "Beryl Hubbard", "Bentley Rayburn", "Peter Lillback", "Tim Bayly", "Charlie Morrison", "Keith Stoeber", "Don Weyburn"}:\n    raise SystemExit("Women in the Military: committee roster drift")\npositions = {e.get("event_id"): e for e in wim.get("formal_positions", [])}\nexpected_wim = {\n    "2001-wim-majority-mans-duty-to-protect-woman": 5,\n    "2001-wim-minority-wise-counsel": 4,\n    "2002-wim-majority-final-recommendations": 6,\n    "2002-wim-minority-pastoral-counsel": 4,\n}\nif set(positions) != set(expected_wim):\n    raise SystemExit(f"Women in the Military: formal-position event set drift: {sorted(positions)}")\nfor event_id, count in expected_wim.items():\n    e=positions[event_id]\n    if e.get("signer_count") != count or len(e.get("signers", [])) != count:\n        raise SystemExit(f"{event_id}: signer count drift")\n    if e.get("evidence_class") != "signed_formal_report_or_minority_report" or e.get("ideological_weight") != 0:\n        raise SystemExit(f"{event_id}: evidence semantics drift")\nif {r.get("name_as_printed") for r in positions["2001-wim-majority-mans-duty-to-protect-woman"]["signers"]} != {"Timothy B. Bayly", "Bentley B. Rayburn", "Donald B. Weyburn", "Stephen W. Leonard", "Keith Stoeber"}:\n    raise SystemExit("2001 WIM majority: signer set drift")\nif {r.get("name_as_printed") for r in positions["2001-wim-minority-wise-counsel"]["signers"]} != {"Stephen Clark", "Charles Morrison", "Beryl Hubbard", "Ronald Swafford"}:\n    raise SystemExit("2001 WIM minority: signer set drift")\nif any(r.get("name_as_printed") == "Peter Lillback" for e in positions.values() if e.get("year") == 2001 for r in e.get("signers", [])):\n    raise SystemExit("2001 WIM: do not infer Peter Lillback into either published 2001 signature block")\nif {r.get("name_as_printed") for r in positions["2002-wim-majority-final-recommendations"]["signers"]} != {"Steve Leonard", "Bentley Rayburn", "Tim Bayly", "Keith Stoeber", "Peter Lillback", "Don Weyburn"}:\n    raise SystemExit("2002 WIM majority: signer set drift")\nif {r.get("name_as_printed") for r in positions["2002-wim-minority-pastoral-counsel"]["signers"]} != {"Steven Clark", "Beryl Hubbard", "Charles Morrison", "Ronald Swafford"}:\n    raise SystemExit("2002 WIM minority: signer set drift")\nactions = {a.get("year"): a for a in wim.get("assembly_actions", [])}\nif actions.get(2002, {}).get("recorded_negative_vote_count") != 77 or actions.get(2002, {}).get("person_level_evidence_for_77") is not False:\n    raise SystemExit("2002 WIM: preserve 77-vote count without inventing a named roster")\n\n'''
          if '# 2001-2002 Women in the Military report family.' not in v:
              v=v.replace(hierarchy_marker,checks+hierarchy_marker,1)
          req_marker='    "2008-overture-9-deaconess-study-minority-report",\n'
          additions='''    "2001-wim-consensus-report",\n    "2001-wim-majority-duty-report",\n    "2001-wim-minority-wise-counsel-report",\n    "2002-wim-majority-final-recommendations",\n    "2002-wim-minority-pastoral-counsel",\n'''
          if '    "2001-wim-consensus-report",' not in v:
              v=v.replace(req_marker,additions+req_marker,1)
          vpath.write_text(v)
          PY

          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .
          node scripts/validate-data.mjs
          python3 scripts/validate-formal-position-evidence.py .
          python3 scripts/validate-research-imports.py .

          rm .github/workflows/integrate-wim-batch3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Women in the Military formal positions"
          git push origin HEAD:research/women-worship-formal-position-batch3-2026-09-04
