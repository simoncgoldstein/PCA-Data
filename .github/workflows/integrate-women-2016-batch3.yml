          '''

          protest_text = '''
          TE Andrew Barnes|Heartland
          TE Ryan Biese|Mississippi Valley
          TE Bob Brubaker|Southwest Florida
          TE Andrew P. Dionne|Calvary
          TE Ben Duncan|North West Georgia
          RE Shay Fout|Ohio Valley
          TE Geoff Gleason|Savannah River
          RE Vaughn R. Hamilton|Tennessee Valley
          RE Brad Hansen|Heartland
          TE Mitchell L. Haubert, Jr|Warrior
          TE William F. Hill, Jr|Western Carolina
          TE James A. Jones, Jr|Southern Louisiana
          TE Lane Keister|Palmetto
          TE George E. Lacy, Jr|South Texas
          TE Joel H. Linton|Providence
          TE Dan Lipford|James River
          TE Jim McCarthy|North Florida
          TE Jonathan McGuire|Mississippi Valley
          TE John Eric McKenzie|Tennessee Valley
          TE Tim McQuitty|Western Carolina
          TE Aaron Morgan|Fellowship
          TE Mark O'Neill|Houston Metro
          TE Ryan Speck|Missouri
          RE Thomas H. Taylor, Jr|Savannah River
          TE Ben Thomas|North West Georgia
          TE Lou Veiga|Houston Metro
          TE Brad Waller|Savannah River
          TE C.N. Willborn|Tennessee Valley
          '''

          def parse(text):
              out=[]
              for i, raw in enumerate([x.strip() for x in text.splitlines() if x.strip()], 1):
                  person, presbytery = raw.split('|', 1)
                  office = None
                  name = person
                  if person.startswith('TE '): office, name = 'TE', person[3:]
                  elif person.startswith('RE '): office, name = 'RE', person[3:]
                  out.append({
                      'print_order': i,
                      'name_as_printed': name,
                      'office_as_printed': office,
                      'presbytery_as_printed': presbytery,
                      'normalized_person_id': None,
                  })
              return out

          procedural=parse(procedural_text)
          protest=parse(protest_text)
          assert len(procedural)==173, len(procedural)
          assert len(protest)==28, len(protest)
          assert procedural[69]['name_as_printed']=='Stephen Iler'
          assert procedural[70]['name_as_printed']=='David T. Irving' and procedural[70]['office_as_printed'] is None
          assert protest[4]['name_as_printed']=='Ben Duncan' and protest[4]['presbytery_as_printed']=='North West Georgia'

          payload={
            'metadata': {
              'dataset_id':'2016_women_serving_study_committee_formal_actions',
              'year':2016,
              'assembly':'44th General Assembly',
              'primary_source':'https://www.pcahistory.org/pca/ga/44th_pcaga_2016.pdf',
              'source_type':'official_general_assembly_minutes',
              'source_family':'ga_2016_formal_positions',
              'ideological_weight':0,
              'modeling_rule':"Keep the procedural point-of-order registration distinct from the later substantive protest. Agreement with the point of order establishes only the recorded procedural position; it does not by itself establish opposition to the study committee on its merits. The protest author/presenter is modeled separately from the 28 commissioners whom the minutes explicitly say added their names."
            },
            'procedural_point_of_order_registration': {
              'event_id':'2016-women-study-committee-point-of-order-registration',
              'evidence_class':'recorded_procedural_position',
              'position_specificity':'high_but_procedural',
              'source_locator':'44-38, journal pp. 51-56; PDF pages 52-57; extracted text lines 1851-2039',
              'context':"TE David Coffin raised a point of order that Administrative Committee Recommendation 3 was not properly before the Assembly because the Cooperative Ministries Committee and Administrative Committee lacked the asserted subject-matter authority. The Moderator ruled the point not well taken; after the ruling was sustained, the minutes list commissioners who registered agreement with the point of order and disagreement with the Moderator's ruling.",
              'important_boundary':"Do not convert this roster into a claim that all 173 commissioners opposed a study of women serving in ministry, opposed women serving in ministry generally, or held the later Pipa protest's substantive grounds. This roster establishes the procedural registration only.",
              'registered_commissioner_count':173,
              'commissioners':procedural,
              'ideological_weight':0
            },
            'pipa_protest_against_study_committee': {
              'event_id':'2016-pipa-protest-women-study-committee',
              'evidence_class':'formal_protest_signature',
              'position_specificity':'very_high',
              'source_locator':'44-43, journal pp. 69-70; PDF pages 70-71; extracted text lines 2545-2593',
              'author_presenter':{
                'name_as_printed':'Joseph Pipa',
                'office_as_printed':'TE',
                'role':'presented the protest',
                'normalized_person_id':None
              },
              'protest_position_summary':"The protest opposed establishment of the study committee and stated four grounds: inclusion of women on the committee as contrary to 1 Timothy 2:12-13; concern that reflecting denominational diversity showed insufficient Scriptural or Confessional parameters; concern that the proposed pastoral letter suggested a predetermined goal; and the claim that further study of ordination hindered gospel progress because laying on of hands was already established.",
              'important_boundary':"The minutes explicitly say the following 28 commissioners 'added their names to the protest.' Joseph Pipa is separately named as the presenter of the protest. Preserve those two roles rather than silently describing a 29-name added-signature roster.",
              'added_signer_count':28,
              'added_signers':protest,
              'ideological_weight':0
            },
            'assembly_disposition': {
              'point_of_order_appeal_vote':{'sustain_moderator':582,'against':466,'abstain':36},
              'committee_of_commissioners_substitute_to_answer_negative':{'for':447,'against':699,'abstain':8},
              'permanent_committee_recommendation_to_form_study_committee':{'for':767,'against':375,'abstain':12},
              'answer_to_pipa_protest':{'for':452,'against':148,'abstain':28},
              'aggregate_vote_guardrail':'These aggregate tallies do not identify unnamed individual voters and are not person-level position evidence.'
            }
          }
          path=Path('sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json')
          path.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')

          # Update chronology.
          cpath=Path('sources/normalized/general-assembly/1973-2017-women-deacons-worship-chronology.json')
          chron=json.loads(cpath.read_text())
          event=next(e for e in chron['events'] if e['event_id']=='2016-formation-women-serving-study-committee')
          event['recorded_vote_blocks'][0]['roster_status']='normalized_from_official_minutes'
          event['recorded_vote_blocks'][0]['normalized_source']='sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json'
          event['related_formal_actions'][0]['roster_status']='normalized_from_official_minutes'
          event['related_formal_actions'][0]['normalized_source']='sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json'
          event['related_formal_actions'][0]['role_boundary']='Joseph Pipa is separately modeled as protest author/presenter; 28 commissioners are explicitly listed as having added their names.'
          event['person_level_evidence']={
            'procedural_registration_count':173,
            'protest_added_signer_count':28,
            'protest_author_presenter':'Joseph Pipa',
            'normalized_source':'sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json'
          }
          chron['pending_primary_roster_extractions']=[x for x in chron['pending_primary_roster_extractions'] if x.get('year')!=2016]
          cpath.write_text(json.dumps(chron,indent=2,ensure_ascii=False)+'\n')

          # Update formal-position index.
          ipath=Path('sources/normalized/general-assembly/formal-position-evidence-index.json')
          idx=json.loads(ipath.read_text())
          if not any(x['evidence_class']=='recorded_procedural_position' for x in idx['evidence_hierarchy']):
              idx['evidence_hierarchy'].insert(2,{
                'evidence_class':'recorded_procedural_position',
                'position_specificity':'high_but_issue_limited',
                'rule':'A named procedural registration directly establishes the recorded procedural position. It does not establish the person’s view on the underlying merits unless the record also states that view.'
              })
          ids={x['evidence_id'] for x in idx['normalized_position_sources']}
          if '2016-women-study-committee-point-of-order-registration' not in ids:
              idx['normalized_position_sources'].append({
                'evidence_id':'2016-women-study-committee-point-of-order-registration',
                'year':2016,
                'topic':'women_serving_study_committee_procedural_jurisdiction',
                'evidence_class':'recorded_procedural_position',
                'path':'sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json',
                'coverage':'173 commissioners named in the official minutes as agreeing with the point of order and disagreeing with the Moderator’s ruling',
                'important_boundary':'This establishes the procedural position only, not opposition to the study committee on its merits.'
              })
          if '2016-pipa-protest-women-study-committee' not in ids:
              idx['normalized_position_sources'].append({
                'evidence_id':'2016-pipa-protest-women-study-committee',
                'year':2016,
                'topic':'women_serving_study_committee',
                'evidence_class':'recorded_vote_or_formal_protest_signature',
                'path':'sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json',
                'coverage':'Joseph Pipa named as protest presenter plus 28 commissioners explicitly listed as adding their names',
                'important_boundary':'Preserve Pipa’s author/presenter role separately from the 28 added signers; do not silently call the added-signature roster 29 names.'
              })
          ipath.write_text(json.dumps(idx,indent=2,ensure_ascii=False)+'\n')

          # Integrate the 2016 source family into conservative identity resolution.
          bpath=Path('scripts/build-person-crosswalk.py')
          text=bpath.read_text()
          marker='# A Faithful PCA snapshots remain separate datasets but one source family.\n'
          if marker not in text:
              raise SystemExit('crosswalk insertion marker missing')
          block='''# 2016 women-serving study-committee formal actions. Both the procedural\n# registration and later protest are one General Assembly source family, so\n# repeated names inside these minutes cannot self-corroborate an identity.\nrelative = "sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json"\nwomen2016 = register_json(relative)\nprocedural2016 = women2016["procedural_point_of_order_registration"]\nfor row in procedural2016.get("commissioners", []):\n    add_record(\n        dataset="women_study_committee_procedural_registration_2016",\n        family="ga_2016_formal_positions",\n        source_path=relative,\n        locator=f"procedural_registration:{row['print_order']}",\n        printed_name=row["name_as_printed"],\n        row=row,\n        source_tier="official_primary",\n        completeness="complete_named_173_commissioner_registration",\n        evidence_type="recorded_procedural_position",\n        presbyteries=[row.get("presbytery_as_printed")],\n        office=row.get("office_as_printed"),\n        existing_id=row.get("normalized_person_id"),\n    )\n\nprotest2016 = women2016["pipa_protest_against_study_committee"]\nfor row in protest2016.get("added_signers", []):\n    add_record(\n        dataset="pipa_women_study_committee_protest_2016",\n        family="ga_2016_formal_positions",\n        source_path=relative,\n        locator=f"protest_added_signer:{row['print_order']}",\n        printed_name=row["name_as_printed"],\n        row=row,\n        source_tier="official_primary",\n        completeness="complete_28_added_signers",\n        evidence_type="formal_protest_signature",\n        presbyteries=[row.get("presbytery_as_printed")],\n        office=row.get("office_as_printed"),\n        existing_id=row.get("normalized_person_id"),\n    )\n\nauthor = protest2016["author_presenter"]\nadd_record(\n    dataset="pipa_women_study_committee_protest_author_2016",\n    family="ga_2016_formal_positions",\n    source_path=relative,\n    locator="protest_author_presenter",\n    printed_name=author["name_as_printed"],\n    row=author,\n    source_tier="official_primary",\n    completeness="complete_named_author_presenter",\n    evidence_type="formal_protest_author_presenter",\n    office=author.get("office_as_printed"),\n    existing_id=author.get("normalized_person_id"),\n)\n\n\n'''
          if 'women_study_committee_procedural_registration_2016' not in text:
              text=text.replace(marker,block+marker,1)
          bpath.write_text(text)

          # Extend formal-position validator.
          vpath=Path('scripts/validate-formal-position-evidence.py')
          v=vpath.read_text()
          load_marker='batch2_chronology_path = root / "sources/normalized/general-assembly/2019-2023-sexuality-formal-position-chronology.json"\n'
          if 'women2016_path' not in v:
              v=v.replace(load_marker,'women2016_path = root / "sources/normalized/general-assembly/2016-women-study-committee-formal-actions.json"\nwomen2016 = json.loads(women2016_path.read_text(encoding="utf-8"))\n'+load_marker,1)
          hierarchy_marker='hierarchy = {row.get("evidence_class"): row for row in index.get("evidence_hierarchy", [])}\n'
          checks='''# 2016 women-serving study-committee formal actions.\nif women2016.get("metadata", {}).get("ideological_weight") != 0:\n    raise SystemExit("2016 women formal actions: ideological_weight must remain 0")\nproc2016 = women2016.get("procedural_point_of_order_registration", {})\nif proc2016.get("registered_commissioner_count") != 173 or len(proc2016.get("commissioners", [])) != 173:\n    raise SystemExit("2016 women procedural registration: expected 173 named commissioners")\nif proc2016.get("evidence_class") != "recorded_procedural_position":\n    raise SystemExit("2016 women procedural registration: evidence class drift")\nif "procedural registration only" not in proc2016.get("important_boundary", ""):\n    raise SystemExit("2016 women procedural registration: merits guardrail missing")\nif proc2016.get("commissioners", [])[70].get("name_as_printed") != "David T. Irving" or proc2016.get("commissioners", [])[70].get("office_as_printed") is not None:\n    raise SystemExit("2016 women procedural registration: preserve David T. Irving office omission as printed")\nprotest2016 = women2016.get("pipa_protest_against_study_committee", {})\nif protest2016.get("added_signer_count") != 28 or len(protest2016.get("added_signers", [])) != 28:\n    raise SystemExit("2016 Pipa protest: expected exactly 28 commissioners explicitly listed as adding names")\nif protest2016.get("author_presenter", {}).get("name_as_printed") != "Joseph Pipa":\n    raise SystemExit("2016 Pipa protest: Joseph Pipa author/presenter record missing")\nif any(r.get("name_as_printed") == "Joseph Pipa" for r in protest2016.get("added_signers", [])):\n    raise SystemExit("2016 Pipa protest: do not collapse author/presenter into the 28-name added-signers list")\nif women2016.get("assembly_disposition", {}).get("permanent_committee_recommendation_to_form_study_committee") != {"for": 767, "against": 375, "abstain": 12}:\n    raise SystemExit("2016 women study committee: final Assembly tally drift")\n\n'''
          if '# 2016 women-serving study-committee formal actions.' not in v:
              v=v.replace(hierarchy_marker,checks+hierarchy_marker,1)
          v=v.replace('    "conference_or_network_participation",\n', '    "conference_or_network_participation",\n    "recorded_procedural_position",\n', 1)
          req_marker='    "2017-women-serving-ministry-consensus-report",\n'
          if '    "2016-women-study-committee-point-of-order-registration",' not in v:
              v=v.replace(req_marker,'    "2016-women-study-committee-point-of-order-registration",\n    "2016-pipa-protest-women-study-committee",\n'+req_marker,1)
          vpath.write_text(v)
          PY

          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .
          node scripts/validate-data.mjs
          python3 scripts/validate-formal-position-evidence.py .
          python3 scripts/validate-research-imports.py .

          rm .github/workflows/integrate-women-2016-batch3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate 2016 women study committee formal actions"
          git push origin HEAD:research/women-worship-formal-position-batch3-2026-09-04
