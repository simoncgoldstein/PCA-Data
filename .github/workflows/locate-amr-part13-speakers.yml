name: Locate AMR Parts 1 and 3 speakers
on:
  push:
    branches: [research/amr-overtures-part13-2026-09-04]
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/amr-overtures-part13-2026-09-04
      - name: Build targeted windows
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          targets={
            'part1':('sources/raw/media/amr/youtube-2026-09-03/captions/xezEYJN8aiM-en-auto-1.vtt',[1080,1270,1430]),
            'part3':('sources/raw/media/amr/youtube-2026-09-03/captions/cxQxeng9eow-en-auto-1.vtt',[480,720,2280,2400,2780,2850])
          }
          def sec(ts):
            h,m,s=ts.replace(',','.').split(':'); return int(h)*3600+int(m)*60+float(s)
          def parse(path):
            raw=Path(path).read_text(errors='ignore'); rows=[]
            for block in re.split(r'\n\s*\n',raw):
              lines=[x.strip() for x in block.splitlines() if x.strip()]
              ti=next((i for i,x in enumerate(lines) if '-->' in x),None)
              if ti is None: continue
              m=re.match(r'(\d\d:\d\d:\d\d[\.,]\d+)\s+-->',lines[ti])
              if not m: continue
              text=' '.join(lines[ti+1:]); text=re.sub(r'<[^>]+>','',text).replace('&gt;','>'); text=re.sub(r'\s+',' ',text).strip()
              if text: rows.append((sec(m.group(1)),text))
            # de-dupe identical rolling lines
            out=[]
            for r in rows:
              if out and r[1]==out[-1][1]: continue
              out.append(r)
            return out
          result={}
          for label,(path,tslist) in targets.items():
            rows=parse(path); vals=[]
            for t0 in tslist:
              seg=[(t,x) for t,x in rows if t0-55<=t<=t0+75]
              text=' '.join(x for _,x in seg)
              vals.append({'center_seconds':t0,'text':text[:5500]})
            result[label]=vals
          Path('research/amr-part13-attribution-windows.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Remove workflow and commit windows
        run: |
          rm .github/workflows/locate-amr-part13-speakers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/amr-part13-attribution-windows.json .github/workflows/locate-amr-part13-speakers.yml
          git commit -m "Locate AMR Parts 1 and 3 speaker windows"
          git push
