name: Locate AMR Part 2 speaker passages

on:
  push:
    branches: [research/amr-issue-extraction-2026-09-04]
    paths: [.github/workflows/locate-amr-part2-phrases.yml]

permissions:
  contents: write

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/amr-issue-extraction-2026-09-04
      - name: Locate phrases
        run: |
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          path=Path('sources/raw/media/amr/youtube-2026-09-03/captions/JpsstSfx40U-en-auto-1.vtt')
          lines=path.read_text(encoding='utf-8').splitlines(); cues=[]; i=0
          while i<len(lines):
              if '-->' not in lines[i]: i+=1; continue
              ts=lines[i].split('-->')[0].strip(); i+=1; parts=[]
              while i<len(lines) and lines[i].strip() and '-->' not in lines[i]:
                  s=html.unescape(re.sub(r'<[^>]+>','',lines[i])).strip()
                  if s: parts.append(s)
                  i+=1
              text=re.sub(r'\s+',' ',' '.join(parts)).strip()
              if text: cues.append({'timestamp':ts,'text':text})
              i+=1
          targets={
            'steve_o37_opposition':['opposed to this overture','opposed to this over'],
            'steve_male_only_deacon':['only calls men to the office of deacon'],
            'david_agrees':['agree with that'],
            'david_scriptural_burden':['almost no scriptural argument'],
            'howie_not_ordain_women':['favor of ordaining women as deacons'],
            'howie_not_o37':['not in favor of this overture'],
            'howie_danvers':['don\'t like declaring things'],
            'host_lords_supper':['all of you said no to this one'],
          }
          out={}
          for key,phrases in targets.items():
              matches=[]
              for c in cues:
                  low=c['text'].lower()
                  if any(p in low for p in phrases): matches.append(c)
              out[key]=matches[:8]
          Path('research/amr-part2-phrase-locators-2026-09-04.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Remove workflow and commit locators
        run: |
          rm .github/workflows/locate-amr-part2-phrases.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Locate AMR Part 2 issue passages"
          git push
