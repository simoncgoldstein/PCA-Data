name: Materialize formal position batch 1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'research/formal-position-mining-batch1-2026-09-04'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Integrate formal position datasets into identity builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-person-crosswalk.py')
          text = path.read_text()
          anchor = '# A Faithful PCA snapshots remain separate datasets but one source family.\n'
          if 'formal_position_2008-overture-9-deaconess-study-minority-report' in text:
              raise SystemExit('formal position batch already integrated')
          insert = '''# 2008-2009 named formal-position records. Records from the same General\n# Assembly share one source family so parallel committee actions in the same\n# minutes cannot corroborate each other into a new identity. The 2009 Assembly\n# is a separate source family and may independently corroborate a repeated name\n# plus context one year later.\nrelative = "sources/normalized/general-assembly/2008-2009-women-formal-position-records.json"\nformal_position_data = load(relative)\nfor event in formal_position_data.get("events", []):\n    year = event["year"]\n    family = f"ga_{year}_formal_positions"\n    dataset = f"formal_position_{event['event_id']}"\n    for index, row in enumerate(event.get("signers", []), 1):\n        add_record(\n            dataset=dataset,\n            family=family,\n            source_path=relative,\n            locator=f"{event['event_id']}:signer:{index}",\n            printed_name=row["name_as_printed"],\n            row=None,\n            source_tier="official_primary",\n            completeness="complete_named_signers",\n            evidence_type="formal_report_concurrence",\n            presbyteries=[row.get("presbytery_as_printed")],\n            existing_id=row.get("normalized_person_id"),\n            backfill=False,\n        )\n\n\n'''
          if anchor not in text:
              raise SystemExit('identity builder anchor missing')
          path.write_text(text.replace(anchor, insert + anchor, 1))
          PY

      - name: Rebuild identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .
          python3 scripts/validate-formal-position-evidence.py .
          python3 scripts/validate-research-imports.py .

      - name: Remove one-time workflow and commit materialized outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-formal-position-batch1.yml
          git add scripts/build-person-crosswalk.py data/people.json sources/normalized/identity analysis/overlap sources/normalized/general-assembly/2008-2009-women-formal-position-records.json
          git status --short
          git commit -m 'Integrate 2008-2009 formal position identities'
          git push origin HEAD:${{ github.head_ref }}
