name: Materialize formal position batch 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'research/formal-position-mining-batch2-2026-09-04'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: research/formal-position-mining-batch2-2026-09-04
          fetch-depth: 0

      - name: Extract official Overture 37 recorded negative votes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          source = Path('sources/raw/general-assembly/2021/48th_pcaga_2021.txt')
          lines = source.read_text(encoding='utf-8', errors='replace').splitlines()

          start = next((i for i, line in enumerate(lines) if 'The following negative votes were recorded by commissioners on' in line), None)
          if start is None:
              raise SystemExit('Could not locate official Overture 37 negative-vote introduction')

          resumed = next((i for i in range(start + 1, min(len(lines), start + 1200)) if 'Chairman' in lines[i] and 'resumed his report' in lines[i]), None)
          scan_end = resumed if resumed is not None else min(len(lines), start + 1200)

          row_pattern = re.compile(r'^\s*(TE|RE)\s+(.+?)\s{2,}(.+?)\s*$')
          matches = []
          for line_no, line in enumerate(lines[start + 1:scan_end], start + 2):
              match = row_pattern.match(line)
              if not match:
                  continue
              office, name, presbytery = (part.strip() for part in match.groups())
              matches.append((line_no, office, name, presbytery, line.rstrip()))

          if len(matches) != 207:
              print('section_start_line', start + 1)
              print('resume_line', None if resumed is None else resumed + 1)
              print('parsed_count', len(matches))
              print('first_matches', [m[4] for m in matches[:12]])
              print('last_matches', [m[4] for m in matches[-12:]])
              raise SystemExit('Expected exactly 207 Overture 37 recorded negative votes before the report resumed')

          rows = [
              {
                  'office_as_printed': office,
                  'name_as_printed': name,
                  'presbytery_as_printed': presbytery,
                  'print_order': index,
                  'source_text_line_1_based': line_no,
                  'normalized_person_id': None,
              }
              for index, (line_no, office, name, presbytery, _) in enumerate(matches, 1)
          ]

          out = {
              'metadata': {
                  'event': '48th General Assembly — Overture 37 Recorded Negative Votes',
                  'year': 2021,
                  'primary_source': 'https://www.pcahistory.org/pca/ga/48th_pcaga_2021.pdf',
                  'local_pdf': 'sources/raw/general-assembly/2021/48th_pcaga_2021.pdf',
                  'local_pdf_text': str(source),
                  'extraction_start_line_1_based': start + 1,
                  'extraction_end_before_line_1_based': None if resumed is None else resumed + 1,
                  'expected_rows': 207,
                  'parsed_rows': len(rows),
                  'identity_rule': 'Printed office, name, and presbytery are preserved from the official minutes; canonical IDs are resolved only through the conservative identity layer.',
                  'vote_semantics': 'A recorded negative vote establishes opposition to the final adopted Overture 37 recommendation at the 48th General Assembly. It does not establish the commissioner’s rationale or position on every related overture.',
                  'procedural_vote_guardrail': 'The immediately preceding 1349-443 tally was the motion to close debate and is not the Overture 37 adoption tally.',
                  'ideological_weight': 0
              },
              'negative_votes': rows
          }
          target = Path('sources/normalized/general-assembly/2021-overture-37-negative-votes.json')
          target.write_text(json.dumps(out, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'rows': len(rows), 'first': rows[0], 'last': rows[-1]}, indent=2))
          PY

      - name: Remove one-time workflow and commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-formal-position-batch2.yml
          git add sources/normalized/general-assembly/2021-overture-37-negative-votes.json
          git commit -m 'Extract 2021 Overture 37 recorded negative votes'
          git push origin HEAD:research/formal-position-mining-batch2-2026-09-04
