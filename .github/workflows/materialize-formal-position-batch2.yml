name: Materialize formal position batch 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'research/formal-position-mining-batch2-2026-09-04'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: research/formal-position-mining-batch2-2026-09-04
          fetch-depth: 0

      - name: Inspect official Overture 37 vote text layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('sources/raw/general-assembly/2021/48th_pcaga_2021.txt')
          text = source.read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()

          hits = []
          for i, line in enumerate(lines):
              low = re.sub(r'\s+', ' ', line.lower()).strip()
              if ('negative' in low and 'vote' in low) or ('overture 37' in low) or ('recommendation 37' in low):
                  hits.append(i)

          print('line_count', len(lines))
          print('hit_count', len(hits))
          for i in hits[-40:]:
              print(f'--- context around line {i+1} ---')
              for j in range(max(0, i-3), min(len(lines), i+8)):
                  print(f'{j+1}: {lines[j]!r}')
          if not hits:
              raise SystemExit('No Overture 37 / negative-vote text hits found')
          PY
