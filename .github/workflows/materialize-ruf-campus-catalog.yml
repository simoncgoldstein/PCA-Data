name: Materialize RUF campus catalog

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'research/ruf-campus-catalog-2025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install bounded PDF dependencies
        run: python -m pip install --disable-pip-version-check pymupdf gdown

      - name: Download official RUF catalog
        run: gdown 1qAYDUxeK-qcfqBfZdVNSXiK7MTqVCWda -O /tmp/CampusCatalog2025-2026.pdf

      - name: Wire catalog into identity and validation
        run: python scripts/prepare-ruf-campus-catalog-integration.py

      - name: Import bounded catalog fields
        run: python scripts/import-ruf-campus-catalog.py /tmp/CampusCatalog2025-2026.pdf .

      - name: Rebuild research outputs
        run: |
          python scripts/match-ffo-churches.py \
            data/churches.json \
            sources/normalized/external-datasets/save-the-pca-ffo/2026-02-08/flagged-churches.json \
            sources/normalized/crosswalks/save-the-pca-ffo-2026-02-08
          python scripts/build-person-crosswalk.py .
          python scripts/build-overlap-analysis.py .
          python scripts/validate-research-imports.py .

      - name: Remove one-time helpers
        run: |
          git rm .github/workflows/materialize-ruf-campus-catalog.yml
          git rm scripts/prepare-ruf-campus-catalog-integration.py

      - name: Commit deterministic catalog integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "normalize RUF 2025 campus catalog roles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
