              'year':2003,
              'topic':'good_faith_subscription_bco_21_4',
              'evidence_class':'recorded_vote_or_formal_protest_signature',
              'path':'sources/normalized/general-assembly/2003-subscription-formal-position-records.json',
              'coverage':'71 individually recorded negative votes from the original 31st GA minutes; later PCA Digest says 70, with the primary 71 controlling.',
              'important_boundary':'A recorded negative vote establishes the vote on BCO 21-4, not a complete rationale.'
            },
            {
              'evidence_id':'2003-bco-21-4-full-subscription-protest',
              'year':2003,
              'topic':'good_faith_subscription_bco_21_4',
              'evidence_class':'recorded_vote_or_formal_protest_signature',
              'path':'sources/normalized/general-assembly/2003-subscription-formal-position-records.json',
              'coverage':'Morton H. Smith as author/presenter plus 93 named commissioners who joined the protest.',
              'important_boundary':'Author/presenter and joiner are preserved as distinct roles; signership establishes agreement with the protest at that time.'
            },
