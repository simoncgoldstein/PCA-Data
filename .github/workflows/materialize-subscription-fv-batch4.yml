              'coverage':'14 named minority-report signers; minority report adopted 530-477.',
              'important_boundary':'Signership establishes support for the report and recommendation, not every broader subscription inference.'
            },
            {
              'evidence_id':'2003-subscription-overture-16-recorded-negative-vote',
              'year':2003,
              'topic':'confessional_subscription_study_committee',
              'evidence_class':'recorded_vote_or_formal_protest_signature',
              'path':'sources/normalized/general-assembly/2003-subscription-formal-position-records.json',
              'coverage':'TE Chris A. Hutchinson recorded a negative vote on the adopted minority-report action.',
              'important_boundary':'Records the vote only.'
            },
            {
              'evidence_id':'2007-fv-npp-unanimous-study-report',
              'year':2007,
              'topic':'federal_vision_new_perspective_auburn_avenue',
              'evidence_class':'study_committee_consensus_participation',
              'path':'sources/normalized/general-assembly/2002-2007-subscription-federal-vision-chronology.json',
              'coverage':'7 named committee members and 9 declarations explicitly identified by the report as unanimous.',
              'important_boundary':'The explicit unanimity supports assigning the nine declarations to all seven members, but not every sentence, footnote, or characterization in the report.'
            }
          ]
          ids={x['evidence_id'] for x in idx['normalized_position_sources']}
          idx['normalized_position_sources'].extend(x for x in additions if x['evidence_id'] not in ids)
          ip.write_text(json.dumps(idx, indent=2, ensure_ascii=False) + '\n')

          # Remove accidental setup markers, but preserve substantive receipts.
          for rel in ['research/.tmp','research/batch4-branch-start-receipt.json']:
              p=Path(rel)
              if p.exists(): p.unlink()
          PY

          rm .github/workflows/materialize-subscription-fv-batch4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize 2003 subscription and 2007 Federal Vision evidence"
          git push origin HEAD:research/subscription-fv-batch4-2026-09-04
