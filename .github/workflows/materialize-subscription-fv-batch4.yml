          assert len(negative71) == 71, len(negative71)
          assert len(protest93) == 93, len(protest93)
          assert len(minority14) == 14, len(minority14)

          data = {
            'metadata': {
              'dataset_id': 'ga_2003_subscription_formal_position_records',
              'title': '31st General Assembly subscription formal-position records',
              'year': 2003,
              'primary_source': 'https://www.pcahistory.org/pca/ga/31st_pcaga_2003.pdf',
