          # Correct and deepen the 2002-2007 chronology.
          cp = Path('sources/normalized/general-assembly/2002-2007-subscription-federal-vision-chronology.json')
          chron = json.loads(cp.read_text())
          events = chron['events']
          rat = next(e for e in events if e['event_id'] == '2003-good-faith-subscription-ratification')
          rat['recorded_negative_vote_count'] = 71
          rat['recorded_vote_roster_status'] = 'complete_primary_roster_normalized'
          rat['count_discrepancy'] = {
              'primary_minutes': 71,
              'pca_digest': 70,
              'controlling_count': 71,
              'note': 'Original 31st GA minutes control over later Digest summary.'
          }
          rat['person_level_source'] = 'sources/normalized/general-assembly/2003-subscription-formal-position-records.json'
          rat['person_level_rule'] = 'The 71 named negative votes are normalized from the original minutes; the 816-545 tally remains aggregate.'
          extra = [
            {
              'event_id':'2003-subscription-overture-16-minority-report',
              'year':2003,
              'assembly':'31st General Assembly',
              'event_type':'minority_report_and_assembly_action',
              'topic_tags':['confessional_subscription','study_committee','good_faith_subscription'],
              'assembly_action':'A minority report recommending that the subscription study-committee overtures be answered in the negative was adopted 530-477 and became the Assembly action.',
