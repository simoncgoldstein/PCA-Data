          for e in reversed(extra):
              if e['event_id'] not in existing:
                  events.insert(insert_at, e)
          cp.write_text(json.dumps(chron, indent=2, ensure_ascii=False) + '\n')

          gap = {
            'recorded_on':'2026-09-04',
            'issue':'good_faith_subscription_bco_21_4',
