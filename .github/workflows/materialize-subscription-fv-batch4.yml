name: Materialize subscription and Federal Vision Batch 4

on:
  push:
    branches: [research/subscription-fv-batch4-2026-09-04]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/subscription-fv-batch4-2026-09-04
      - name: Write reviewed primary-source records
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          def parse_rows(block):
              rows=[]
              for i, line in enumerate(block.strip().splitlines(), 1):
                  office, name = line.split('|', 1)
                  identity = re.sub(r'\s*\([^)]*\)', '', name).strip()
                  rows.append({
                      'print_order': i,
                      'office_as_printed': office,
                      'name_as_printed': name,
                      'identity_name': identity,
                      'normalized_person_id': None,
                  })
              return rows

          negative71 = parse_rows(r'''
          TE|K. Hugh Acton
          TE|Jon C. Anderson
          TE|Larry E. Ball
          TE|David G. Barker
          TE|Timothy B. (Tim) Bayly
