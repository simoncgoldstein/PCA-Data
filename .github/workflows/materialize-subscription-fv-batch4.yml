              'position_summary': 'The protest opposed the revision of BCO 21-4, appealed to the PCA founding commitment to Southern Presbyterian / Old School subscription, characterized that heritage as full or strict subscription, and warned that the revised language lacked adequate safeguards against doctrinal decline.',
