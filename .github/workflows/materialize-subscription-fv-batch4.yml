              'ideological_weight': 0
            },
            'overture_16_subscription_study_minority_report': {
              'event_id': '2003-subscription-overture-16-minority-report',
              'evidence_class': 'signed_formal_report_or_minority_report',
              'assembly_vote_on_minority_report': {'for':530,'against':477},
              'signer_count': 14,
              'signers': minority14,
              'position_summary': 'The minority report recommended answering the subscription study-committee overtures in the negative and allowing the newly adopted Good Faith Subscription framework to operate for a period before commissioning another study.',
              'important_boundary': 'Signership establishes support for this minority report and its stated recommendation; it does not by itself establish a complete theory of confessional subscription.',
              'ideological_weight': 0
            },
            'overture_16_minority_report_recorded_negative_vote': {
              'event_id': '2003-subscription-overture-16-recorded-negative-vote',
              'evidence_class': 'recorded_vote_or_formal_protest_signature',
              'vote_count': 1,
              'voter': {'office_as_printed':'TE','name_as_printed':'Chris A. Hutchinson','identity_name':'Chris A. Hutchinson','normalized_person_id':None},
              'action': 'Recorded negative vote after the minority report was adopted as the Assembly action.',
