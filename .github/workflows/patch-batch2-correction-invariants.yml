name: Patch Batch 2 correction invariants

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'research/formal-position-mining-batch2-2026-09-04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/formal-position-mining-batch2-2026-09-04
          fetch-depth: 0
      - name: Update corrected-source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          validator = Path('scripts/validate-research-imports.py')
          text = validator.read_text(encoding='utf-8')
          old = 'validate_roster("sources/normalized/revoice/overture-15-negative-votes-2022.json", "negative_votes", 199, "print_order")'
          new = 'validate_roster("sources/normalized/revoice/overture-15-negative-votes-2022.json", "negative_votes", 200, "print_order")'
          if old not in text and new not in text:
              raise SystemExit('O15 roster invariant anchor missing')
          text = text.replace(old, new)

          old_block = '''ratification = load("sources/normalized/revoice/overture-15-presbytery-ratification-2023.json")\nvotes = ratification.get("presbytery_votes", [])\nif len(votes) != 88 or [r.get("print_order") for r in votes] != list(range(1, 89)):\n    errors.append("overture-15-presbytery-ratification-2023: expected 88 consecutive rows")\nif sum(r.get("reported") is True for r in votes) != 68:\n    errors.append("overture-15-presbytery-ratification-2023: expected 68 reporting rows")\nif sum(r.get("passed") is True for r in votes) != 39 or sum(r.get("not_passed") is True for r in votes) != 29:\n    errors.append("overture-15-presbytery-ratification-2023: official result mismatch")\n'''
          new_block = '''ratification = load("sources/normalized/revoice/overture-15-presbytery-ratification-2023.json")\nvotes = ratification.get("presbytery_votes", [])\nif len(votes) != 88 or [r.get("print_order") for r in votes] != list(range(1, 89)):\n    errors.append("overture-15-presbytery-ratification-2023: expected 88 consecutive rows in preserved 50th-GA snapshot")\nif sum(r.get("reported") is True for r in votes) != 68:\n    errors.append("overture-15-presbytery-ratification-2023: preserved 50th-GA snapshot should contain 68 reporting rows")\nif sum(r.get("passed") is True for r in votes) != 39 or sum(r.get("not_passed") is True for r in votes) != 29:\n    errors.append("overture-15-presbytery-ratification-2023: preserved 50th-GA snapshot should reproduce 39-29")\nrm = ratification.get("metadata", {})\nif rm.get("status") != "superseded_by_51st_ga_correction":\n    errors.append("overture-15-presbytery-ratification-2023: superseded-snapshot status missing")\nif rm.get("corrected_official_totals") != {"for": 48, "against": 32, "presbyteries": 88, "reporting": 80, "two_thirds_needed": 59}:\n    errors.append("overture-15-presbytery-ratification-2023: corrected 51st-GA totals missing")\n'''
          if old_block not in text and new_block not in text:
              raise SystemExit('ratification validator anchor missing')
          text = text.replace(old_block, new_block)
          validator.write_text(text, encoding='utf-8')

          path = Path('sources/normalized/revoice/overture-15-presbytery-ratification-2023.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          meta = data['metadata']
          old_totals = meta.pop('official_totals', None)
          if old_totals is not None:
              meta['published_50th_ga_totals'] = old_totals
          meta['status'] = 'superseded_by_51st_ga_correction'
          meta['superseded_by'] = '51st General Assembly Corrections to Previous Minutes, printed pages 1217-1219'
          meta['correction_source'] = 'https://www.pcahistory.org/pca/ga/51st_pcaga_2024.pdf'
          meta['corrected_official_totals'] = {
              'for': 48,
              'against': 32,
              'presbyteries': 88,
              'reporting': 80,
              'two_thirds_needed': 59
          }
          meta['correction_note'] = 'The 51st GA states that the 50th GA published tallies omitted the onsite revision reflecting the most up-to-date presbytery votes. The 88 per-presbytery rows below remain a preserved transcription of the superseded 50th-GA published table, not the corrected final table.'
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit correction-invariant patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-batch2-correction-invariants.yml
          git add scripts/validate-research-imports.py sources/normalized/revoice/overture-15-presbytery-ratification-2023.json
          git commit -m 'Preserve corrected Overture 15 ratification semantics'
          git push origin HEAD:research/formal-position-mining-batch2-2026-09-04
