name: Recover Insider Movements formal-position evidence

on:
  push:
    branches:
      - research/insider-movements-recovery-2026-09-04
    paths:
      - scripts/recover-insider-movements.py
      - .github/workflows/recover-insider-movements.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply recovery integration
        run: python3 scripts/recover-insider-movements.py
      - name: Rebuild generated outputs
        run: |
          python3 scripts/build-person-crosswalk.py
          python3 scripts/build-overlap-analysis.py
      - name: Validate
        run: |
          python3 scripts/validate-formal-position-evidence.py
          node scripts/validate-data.mjs
          python3 scripts/validate-research-imports.py
      - name: Commit recovered materialization
        run: |
          rm scripts/recover-insider-movements.py
          rm .github/workflows/recover-insider-movements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover Insider Movements formal positions"
          git push
