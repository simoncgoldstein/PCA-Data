name: Recover Revoice18 Wayback program

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'research/revoice18-program-recovery-2026-09-04'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Internet Archive CDX
        run: |
          mkdir -p /tmp/revoice18
          for host in revoice.us www.revoice.us; do
            url="https://web.archive.org/cdx/search/cdx?url=${host}/events/revoice18/&from=2018&to=2019&output=json&fl=timestamp,original,statuscode,mimetype,digest&filter=statuscode:200&collapse=digest"
            curl -A 'Mozilla/5.0' -fL --retry 3 --retry-delay 2 "$url" -o "/tmp/revoice18/cdx-${host}.json" || true
          done

      - name: Fetch all distinct archived program bodies
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/revoice18')
          captures = []
          for path in root.glob('cdx-*.json'):
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  continue
              if not data or len(data) < 2:
                  continue
              header = data[0]
              for values in data[1:]:
                  row = dict(zip(header, values))
                  key = (row.get('timestamp'), row.get('original'), row.get('digest'))
                  if key not in {(x.get('timestamp'), x.get('original'), x.get('digest')) for x in captures}:
                      captures.append(row)

          (root / 'capture-index.json').write_text(json.dumps(captures, indent=2) + '\n')
          for index, row in enumerate(captures, 1):
              timestamp = row['timestamp']
              original = row['original']
              target = root / f"capture-{index:02d}-{timestamp}.html"
              archive_url = f"https://web.archive.org/web/{timestamp}id_/{original}"
              proc = subprocess.run([
                  'curl', '-A', 'Mozilla/5.0', '-fL', '--retry', '3', '--retry-delay', '2',
                  archive_url, '-o', str(target)
              ], text=True, capture_output=True)
              if proc.returncode != 0:
                  target.with_suffix('.error.txt').write_text(proc.stderr)
          print(json.dumps({'capture_count': len(captures)}, indent=2))
          PY

      - name: Record known timestamp probes if CDX is empty
        run: |
          for spec in \
            '20180629052224|http://www.revoice.us/events/revoice18/' \
            '20180828014500|http://revoice.us/events/revoice18/'; do
            ts="${spec%%|*}"
            original="${spec#*|}"
            out="/tmp/revoice18/probe-${ts}.html"
            curl -A 'Mozilla/5.0' -fL --retry 3 --retry-delay 2 \
              "https://web.archive.org/web/${ts}id_/${original}" -o "$out" 2>"/tmp/revoice18/probe-${ts}.stderr.txt" || true
          done

      - name: Summarize recovered files
        run: |
          ls -lah /tmp/revoice18
          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path('/tmp/revoice18').glob('*.html')):
              data = path.read_bytes()
              print(path.name, len(data), data[:100])
          PY

      - name: Archive recovery artifact
        uses: actions/upload-artifact@v6
        with:
          name: revoice18-wayback-recovery
          path: /tmp/revoice18
