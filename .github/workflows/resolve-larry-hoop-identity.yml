name: Resolve Larry Hoop identity

on:
  push:
    branches: [research/subscription-fv-batch4-2026-09-04]

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/subscription-fv-batch4-2026-09-04

      - name: Apply reviewed identity resolution
        run: python3 scripts/resolve-larry-hoop-identity.py

      - name: Rebuild generated identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py
          python3 scripts/build-overlap-analysis.py

      - name: Validate
        run: |
          python3 scripts/validate-formal-position-evidence.py
          node scripts/validate-data.mjs
          python3 scripts/validate-research-imports.py

      - name: Commit materialized result
        run: |
          rm -f .github/workflows/resolve-larry-hoop-identity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Resolve Larry C. Hoop identity variant"
          git push
