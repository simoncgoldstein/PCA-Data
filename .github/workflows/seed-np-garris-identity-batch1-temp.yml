name: Seed NP Garris identity batch 1 (temporary)

on:
  push:
    paths:
      - '.github/seed-np-garris-identity-batch1.trigger'

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply reviewed canonical identities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          people_path = 'data/people.json'
          people = load(people_path)
          additions = [
              {
                  'id': 'david-richmon',
                  'name': 'David Richmon',
                  'ordination': 'Teaching Elder',
                  'current_role': None,
                  'current_organization': None,
                  'denominational_status': 'PCA Teaching Elder documented in the 2024 Garris Letter 1 source; historical Pacific Northwest ministry identity reviewed in this slice',
                  'current_role_source_ids': [],
                  'profile_status': 'source_assessed',
              },
              {
                  'id': 'david-lindberg',
                  'name': 'David Lindberg',
                  'ordination': 'Teaching Elder',
                  'current_role': None,
                  'current_organization': None,
                  'denominational_status': 'PCA Teaching Elder documented in the 2024 Garris Letter 1 and official North Texas sources; historical Metro Atlanta identity reviewed in this slice',
                  'current_role_source_ids': [],
                  'profile_status': 'source_assessed',
              },
          ]
          by_id = {p['id']: p for p in people}
          for item in additions:
              if item['id'] in by_id:
                  existing = by_id[item['id']]
                  if existing.get('name') != item['name']:
                      raise SystemExit(f"conflicting person seed: {item['id']}")
                  # A reviewed identity may already exist as a generated
                  # identity_crosswalk person. Promote that exact row to the
                  # durable source-assessed seed rather than adding a duplicate.
                  existing.update(item)
              else:
                  people.append(item)
          write(people_path, people)

          np_path = 'sources/normalized/national-partnership/confirmed-memberships-canonical.json'
          np_data = load(np_path)
          wanted = {'David Richmon': 'david-richmon', 'David Lindberg': 'david-lindberg'}
          found = set()
          for row in np_data['confirmed_members']:
              name = row.get('canonical_name')
              if name in wanted:
                  row['normalized_person_id'] = wanted[name]
                  found.add(name)
          if found != set(wanted):
              raise SystemExit(f"missing NP member rows: {set(wanted)-found}")
          write(np_path, np_data)

          garris_path = 'sources/normalized/public-statements/garris-letters-2024.json'
          garris = load(garris_path)
          expected = {32: ('David Lindberg', 'david-lindberg'), 39: ('David Richmon', 'david-richmon')}
          applied = set()
          for letter in garris['letters']:
              if letter['letter_id'] != 'garris-letter-1':
                  continue
              for signer in letter['signers']:
                  order = signer['print_order']
                  if order in expected:
                      expected_name, person_id = expected[order]
                      if signer['name_as_printed'] != expected_name:
                          raise SystemExit(f"unexpected Garris row {order}: {signer['name_as_printed']}")
                      signer['normalized_person_id'] = person_id
                      applied.add(order)
          if applied != set(expected):
              raise SystemExit(f"missing Garris rows: {set(expected)-applied}")
          write(garris_path, garris)
          PY

      - name: Rebuild generated identity and analysis outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 scripts/build-overlap-analysis.py .
          python3 scripts/build-national-partnership-continuity-analysis.py .

      - name: Commit reviewed identities and generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/people.json \
            data/affiliations.json \
            sources/normalized/national-partnership/confirmed-memberships-canonical.json \
            sources/normalized/public-statements/garris-letters-2024.json \
            sources/normalized/identity \
            analysis/overlap \
            analysis/national-partnership
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'apply reviewed NP Garris identities for Lindberg and Richmon'
          git push
