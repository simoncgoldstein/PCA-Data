name: Seed NP post-archive identity batch 1 (temporary)

on:
  push:
    paths:
      - '.github/seed-np-postarchive-identity-batch1.trigger'

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply reviewed canonical identities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, value):
              Path(path).write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          people_path = 'data/people.json'
          people = load(people_path)
          reviewed = [
              ('ben-lyon', 'Ben Lyon', 'Teaching Elder'),
              ('bruce-o-neil', "Bruce O'Neil", 'Teaching Elder'),
              ('bruce-terrell', 'Bruce Terrell', 'Ruling Elder'),
              ('jeremy-fair', 'Jeremy Fair', 'Teaching Elder'),
              ('justin-edgar', 'Justin Edgar', 'Teaching Elder'),
              ('luke-evans', 'Luke Evans', 'Teaching Elder'),
              ('omar-ortiz', 'Omar Ortiz', 'Teaching Elder'),
              ('peter-rowan', 'Peter Rowan', 'Teaching Elder'),
              ('rob-wootton', 'Rob Wootton', 'Teaching Elder'),
              ('tim-lecroy', 'Tim LeCroy', 'Teaching Elder'),
              ('nate-conrad', 'Nate Conrad', 'Teaching Elder'),
          ]
          by_id = {p['id']: p for p in people}
          for pid, name, ordination in reviewed:
              item = {
                  'id': pid,
                  'name': name,
                  'ordination': ordination,
                  'current_role': None,
                  'current_organization': None,
                  'denominational_status': 'PCA officer documented across reviewed National Partnership and official 2022 General Assembly action sources; current role not assessed in this identity slice',
                  'current_role_source_ids': [],
                  'profile_status': 'source_assessed',
              }
              if pid in by_id:
                  existing = by_id[pid]
                  # Preserve richer current-role information on an already-reviewed seed.
                  if existing.get('name') not in {name, "Bruce O’Neil"}:
                      raise SystemExit(f'conflicting person seed: {pid} {existing.get("name")}')
                  existing['profile_status'] = 'source_assessed'
                  existing['ordination'] = existing.get('ordination') or ordination
                  if existing.get('denominational_status') in {None, '', 'current status requires verification'} or existing.get('profile_status') == 'identity_crosswalk':
                      existing['denominational_status'] = item['denominational_status']
              else:
                  people.append(item)
                  by_id[pid] = item
          write(people_path, people)

          wanted = {
              'Ben Lyon': 'ben-lyon',
              'Bruce O’Neil': 'bruce-o-neil',
              'Bruce Terrell': 'bruce-terrell',
              'Jeremy Fair': 'jeremy-fair',
              'Justin Edgar': 'justin-edgar',
              'Luke Evans': 'luke-evans',
              'Omar Ortiz': 'omar-ortiz',
              'Peter Rowan': 'peter-rowan',
              'Rob Wootton': 'rob-wootton',
              'Tim LeCroy': 'tim-lecroy',
              'Nate Conrad': 'nate-conrad',
          }

          np_path = 'sources/normalized/national-partnership/confirmed-memberships-canonical.json'
          np_data = load(np_path)
          found = set()
          for row in np_data['confirmed_members']:
              name = row.get('canonical_name')
              if name in wanted:
                  row['normalized_person_id'] = wanted[name]
                  found.add(name)
          if found != set(wanted):
              raise SystemExit(f'missing NP rows: {sorted(set(wanted)-found)}')
          write(np_path, np_data)

          o15_path = 'sources/normalized/revoice/overture-15-negative-votes-2022.json'
          o15 = load(o15_path)
          o15_expected = {
              118: ('Ben Lyon', 'ben-lyon'),
              130: ("Bruce O'Neil", 'bruce-o-neil'),
              178: ('Bruce Terrell', 'bruce-terrell'),
              50: ('Jeremy Fair', 'jeremy-fair'),
              46: ('Justin Edgar', 'justin-edgar'),
              49: ('Luke Evans', 'luke-evans'),
              131: ('Omar Ortiz', 'omar-ortiz'),
              149: ('Peter Rowan', 'peter-rowan'),
              196: ('Rob Wootton', 'rob-wootton'),
              103: ('Tim LeCroy', 'tim-lecroy'),
          }
          applied = set()
          for row in o15['negative_votes']:
              order = row['print_order']
              if order in o15_expected:
                  expected_name, pid = o15_expected[order]
                  if row['name_as_printed'] != expected_name:
                      raise SystemExit(f'O15 row mismatch {order}: {row["name_as_printed"]}')
                  row['normalized_person_id'] = pid
                  applied.add(order)
          if applied != set(o15_expected):
              raise SystemExit(f'missing O15 rows: {sorted(set(o15_expected)-applied)}')
          write(o15_path, o15)

          nae_path = 'sources/normalized/nae/withdrawal-protest-signers-2022.json'
          nae = load(nae_path)
          nae_expected = {
              114: ('Ben Lyon', 'ben-lyon'),
              47: ('Jeremy Fair', 'jeremy-fair'),
              33: ('Nate Conrad', 'nate-conrad'),
              126: ('Omar Ortiz', 'omar-ortiz'),
              148: ('Peter Rowan', 'peter-rowan'),
          }
          applied = set()
          for row in nae['signers']:
              order = row['print_order']
              if order in nae_expected:
                  expected_name, pid = nae_expected[order]
                  if row['name_as_printed'] != expected_name:
                      raise SystemExit(f'NAE row mismatch {order}: {row["name_as_printed"]}')
                  row['normalized_person_id'] = pid
                  applied.add(order)
          if applied != set(nae_expected):
              raise SystemExit(f'missing NAE rows: {sorted(set(nae_expected)-applied)}')
          write(nae_path, nae)
          PY

      - name: Rebuild generated identity and continuity outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .
          python3 scripts/build-national-partnership-continuity-analysis.py .

      - name: Commit reviewed identities and generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/people.json \
            sources/normalized/national-partnership/confirmed-memberships-canonical.json \
            sources/normalized/revoice/overture-15-negative-votes-2022.json \
            sources/normalized/nae/withdrawal-protest-signers-2022.json \
            sources/normalized/identity \
            analysis/overlap \
            analysis/national-partnership
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'apply reviewed NP post-archive identities batch 1'
          git push
