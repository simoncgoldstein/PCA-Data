name: Validate 2017 women-serving canonical links

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "data/people.json"
      - "data/events.json"
      - "data/affiliations.json"
      - "data/sources.json"
      - "sources/raw/identity/2017-women-serving-identity-evidence-batch1-2026-09-14.json"
      - "sources/raw/identity/2017-women-serving-identity-evidence-batch2-2026-09-14.json"
      - "sources/raw/identity/2017-women-serving-identity-evidence-batch3-2026-09-14.json"
      - "sources/raw/identity/2017-women-serving-identity-evidence-batch4-2026-09-14.json"
      - "sources/normalized/general-assembly/2017-women-serving-ministry-report.json"
      - "sources/normalized/general-assembly/2017-women-serving-ministry-person-edges.json"
      - "scripts/validate-2017-women-serving-canonical-links.py"
      - "scripts/validate-2017-women-serving-identity-batch2.py"
      - "scripts/validate-2017-women-serving-identity-batch3.py"
      - "scripts/validate-2017-women-serving-identity-batch4.py"
      - ".github/workflows/validate-2017-women-serving-canonical-links.yml"

permissions:
  contents: read

jobs:
  validate-2017-women-serving-canonical-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate 2017 women-serving canonical links
        run: python3 scripts/validate-2017-women-serving-canonical-links.py .
      - name: Validate 2017 women-serving identity batch 2
        run: python3 scripts/validate-2017-women-serving-identity-batch2.py .
      - name: Validate 2017 women-serving identity batch 3
        run: python3 scripts/validate-2017-women-serving-identity-batch3.py .
      - name: Validate 2017 women-serving identity batch 4
        run: python3 scripts/validate-2017-women-serving-identity-batch4.py .
