name: Validate GRN organizational framing

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-grn-framing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate GRN organizational framing
        run: python3 scripts/validate-grn-organizational-framing.py .
