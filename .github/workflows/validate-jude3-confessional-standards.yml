name: Validate Jude 3 confessional standards

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-jude3-confessional-standards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Jude 3 confessional standards
        run: python3 scripts/validate-jude3-confessional-standards.py .
