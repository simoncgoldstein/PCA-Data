name: Validate Jude 3 PCA trajectory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-jude3-pca-trajectory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Jude 3 PCA trajectory evidence
        run: python3 scripts/validate-jude3-pca-trajectory.py .
