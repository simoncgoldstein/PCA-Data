name: Validate Jude 3 women and office positions

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-jude3-women-office:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Jude 3 women and office positions
        run: python3 scripts/validate-jude3-women-office-positions.py .
