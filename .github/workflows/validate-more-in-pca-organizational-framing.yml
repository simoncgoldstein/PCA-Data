name: Validate MORE in the PCA organizational framing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-more-in-pca-framing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate MORE in the PCA organizational framing
        run: python3 scripts/validate-more-in-pca-organizational-framing.py .
