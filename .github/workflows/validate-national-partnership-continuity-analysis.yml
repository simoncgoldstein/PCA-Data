name: Validate National Partnership continuity analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/national-partnership/**'
      - 'analysis/overlap/**'
      - 'scripts/build-national-partnership-continuity-analysis.py'
      - 'scripts/validate-national-partnership-continuity-analysis.py'
      - 'scripts/build-person-crosswalk.py'
      - 'scripts/project-garris-signers.py'
      - 'scripts/build-overlap-analysis.py'
      - '.github/workflows/validate-national-partnership-continuity-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'analysis/national-partnership/**'
      - 'analysis/overlap/**'
      - 'scripts/build-national-partnership-continuity-analysis.py'
      - 'scripts/validate-national-partnership-continuity-analysis.py'
      - 'scripts/build-person-crosswalk.py'
      - 'scripts/project-garris-signers.py'
      - 'scripts/build-overlap-analysis.py'
      - '.github/workflows/validate-national-partnership-continuity-analysis.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild prerequisite identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Rebuild National Partnership continuity analysis
        run: python3 scripts/build-national-partnership-continuity-analysis.py .

      - name: Validate National Partnership continuity boundaries
        run: python3 scripts/validate-national-partnership-continuity-analysis.py .

      - name: Verify generated outputs are current
        run: git diff --exit-code
