name: Validate NP residual identity batch 2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild identity and overlap outputs
        run: |
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/project-garris-signers.py .
          python3 scripts/project-national-partnership-members.py .
          python3 scripts/build-overlap-analysis.py .
          python3 scripts/build-national-partnership-continuity-analysis.py .
      - name: Validate reviewed residual identity batch
        run: python3 scripts/validate-np-residual-identity-batch2.py .
      - name: Require generated outputs current
        run: git diff --exit-code
