name: Validate O23 O37 authored person positions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-o23-o37-authored-person-positions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate O23 O37 authored person positions
        run: python3 scripts/validate-o23-o37-authored-person-positions.py .
