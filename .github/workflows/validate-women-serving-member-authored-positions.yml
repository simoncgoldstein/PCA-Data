name: Validate women-serving member authored positions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "sources/normalized/general-assembly/2012-2019-women-serving-member-authored-positions.json"
      - "sources/normalized/general-assembly/2017-women-serving-ministry-person-edges.json"
      - "data/people.json"
      - "scripts/validate-women-serving-member-authored-positions.py"
      - ".github/workflows/validate-women-serving-member-authored-positions.yml"

permissions:
  contents: read

jobs:
  validate-women-serving-member-authored-positions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate person-specific women-office evidence
        run: python3 scripts/validate-women-serving-member-authored-positions.py .
