name: Validate research data

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check application syntax
        run: node --check app.js

      - name: Validate structured data
        run: node scripts/validate-data.mjs

      - name: Validate research imports
        run: python3 scripts/validate-research-imports.py .

      - name: Regenerate institution snapshot
        run: |
          python3 scripts/normalize-institution-snapshots.py . /tmp/current-role-snapshots-candidate.json
          cp /tmp/current-role-snapshots-candidate.json sources/normalized/institutions/current-role-snapshots-2026-09-03.json

      - name: Rebuild generated research outputs
        run: |
          python3 scripts/match-ffo-churches.py \
            data/churches.json \
            sources/normalized/external-datasets/save-the-pca-ffo/2026-02-08/flagged-churches.json \
            sources/normalized/crosswalks/save-the-pca-ffo-2026-02-08
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Commit deterministic generated outputs to PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "regenerate institution snapshot batch 1"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Verify generated outputs are current
        run: git diff --exit-code
