name: Validate research data

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Keep RUF transition and current-role rows in one identity family
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-person-crosswalk.py')
          text = path.read_text()
          old = 'family="ruf_staff_transitions",'
          new = 'family="institution_reformed-university-fellowship",'
          if old not in text:
              raise SystemExit('RUF transition family marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Rebuild generated research outputs
        run: |
          python3 scripts/match-ffo-churches.py \
            data/churches.json \
            sources/normalized/external-datasets/save-the-pca-ffo/2026-02-08/flagged-churches.json \
            sources/normalized/crosswalks/save-the-pca-ffo-2026-02-08
          python3 scripts/build-person-crosswalk.py .
          python3 scripts/build-overlap-analysis.py .

      - name: Validate corrected identity model
        run: |
          node --check app.js
          node scripts/validate-data.mjs
          python3 scripts/validate-research-imports.py .
          tmp="$(mktemp)"
          python3 scripts/normalize-ruf-transitions.py . "$tmp"
          diff -u sources/normalized/institutions/ruf/role-transitions-2026.json "$tmp"

      - name: Restore normal read-only validation workflow
        run: git checkout origin/main -- .github/workflows/validate.yml

      - name: Commit corrected identity-family outputs
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "keep RUF transition evidence in one identity source family"
          git push origin "HEAD:${HEAD_BRANCH}"
