name: Validate research data

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check application syntax
        run: node --check app.js

      - name: Validate structured data
        run: node scripts/validate-data.mjs

      - name: Validate current research imports
        run: python3 scripts/validate-research-imports.py .

      - name: Generate RUF 2026 transition candidate
        run: python3 scripts/normalize-ruf-transitions.py . /tmp/ruf-role-transitions-2026.json

      - name: Archive RUF 2026 transition candidate
        uses: actions/upload-artifact@v6
        with:
          name: ruf-transitions-2026-candidate
          path: /tmp/ruf-role-transitions-2026.json
