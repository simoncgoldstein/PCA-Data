name: Validate research data

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check application syntax
        run: node --check app.js

      - name: Validate structured data
        run: node scripts/validate-data.mjs

      - name: Validate current research imports
        run: python3 scripts/validate-research-imports.py .

      - name: Generate RTS and MTW institution candidate
        run: python3 scripts/normalize-institution-snapshots.py . /tmp/current-role-snapshots-candidate.json

      - name: Archive RTS and MTW institution candidate
        uses: actions/upload-artifact@v6
        with:
          name: institution-ingest-batch2-candidate
          path: /tmp/current-role-snapshots-candidate.json
